<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior-x:none}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;overflow:hidden;background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
#toolbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:4px 8px;display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#toolbar .sep{width:1px;height:20px;background:#ddd;margin:0 3px;flex-shrink:0}
#toolbar button{padding:3px 8px;border:1px solid #ccc;border-radius:3px;background:#fff;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0}
#toolbar button:hover{background:#e8f0fe;border-color:#4A90D9}
#toolbar button:active{background:#d0e0f8}
#toolbar button.danger{color:#e74c3c}
#toolbar button.danger:hover{background:#fde8e8;border-color:#e74c3c}
#toolbar .clip-info{font-size:10px;color:#999;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toolbar .version-info{font-size:11px;color:#888;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
#zoom-panel{position:fixed;left:8px;top:50%;transform:translateY(-50%);background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .25s}
#zoom-panel.collapsed{top:42px;transform:none;padding:4px;background:transparent;border:none;box-shadow:none;gap:0}
#zoom-panel.collapsed .zoom-panel-inner{display:none}
#zoom-panel button{width:32px;height:32px;border:1px solid #ccc;border-radius:5px;background:#fff;cursor:pointer;font-size:15px;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;padding:0}
#zoom-panel button:hover{background:#e8f0fe;border-color:#4A90D9}
#zoom-panel button:active{background:#d0e0f8}
#zoom-panel .toggle-btn{width:28px;height:28px;font-size:13px;border-radius:50%;display:flex}
#zoom-panel .zoom-info{font-size:10px;color:#666;text-align:center;line-height:1.2;padding:2px 0;min-width:32px}
#zoom-panel .zoom-sep{width:24px;height:1px;background:#ddd;margin:2px 0}
.dropdown{position:relative;display:inline-block}
.dropdown-menu{display:none;position:fixed;background:#fff;border:1px solid #ddd;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:100px;z-index:1000;padding:2px 0}
.dropdown-menu.show{display:block}
.dropdown-item{padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.dropdown-item:hover{background:#f0f4ff;color:#4a6cf7}
.dropdown-item.danger{color:#e74c3c}
.dropdown-item.danger:hover{background:#fef0ef}
.dropdown-divider{height:1px;background:#eee;margin:2px 0}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:6px;margin-bottom:4px;background:#f8f9fa;cursor:pointer;transition:background .15s}
.file-item:hover{background:#e8f0fe}
.file-item .file-name{font-size:13px;color:#333;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .file-time{font-size:11px;color:#999;margin-left:8px;white-space:nowrap}
.file-item .file-del{font-size:12px;color:#e74c3c;cursor:pointer;margin-left:8px;padding:2px 6px;border-radius:3px}
.file-item .file-del:hover{background:#fef0ef}
.file-item.active{background:#e8f0fe;border:1px solid #4A90D9}
#viewport{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
#viewport.no-select{user-select:none;-webkit-user-select:none}
#viewport.grabbing{cursor:grabbing}
#viewport.dragging-node{cursor:move}
#canvas{width:100%;height:100%;user-select:none;-webkit-user-select:none}
.mind-node{cursor:pointer}
.mind-node:hover .node-bg{filter:brightness(.97)}
.mind-node.selected .node-bg{stroke:#4A90D9;stroke-width:2.5;filter:brightness(.97)}
.collapse-btn{cursor:pointer}
.collapse-btn:hover circle{fill:#e0e0e0}
.drag-ghost{opacity:.5;pointer-events:none}
.drop-highlight{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#edit-modal,#import-modal,#file-modal,#sync-modal,#sync-conflict-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:200;justify-content:center;align-items:center}
#edit-modal.show,#import-modal.show,#file-modal.show,#sync-modal.show,#sync-conflict-modal.show{display:flex}
.modal-box{background:#fff;border-radius:10px;padding:20px;width:500px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal-box h3{margin-bottom:12px;font-size:16px;color:#333}
.modal-box label{display:block;font-size:13px;color:#555;margin-bottom:4px;margin-top:10px}
.modal-box textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:5px;font-size:13px;font-family:inherit;outline:none;transition:border .2s;resize:vertical}
.modal-box textarea:focus{border-color:#4A90D9}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal-btns button{padding:6px 18px;border-radius:5px;border:1px solid #ccc;background:#fff;cursor:pointer;font-family:inherit;font-size:13px}
.modal-btns button.primary{background:#4A90D9;color:#fff;border-color:#4A90D9}
.modal-btns button.primary:hover{background:#3a7bc8}
.modal-btns button:hover{background:#f0f0f0}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#context-menu{display:none;position:fixed;background:#fff;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:150;padding:2px 0;min-width:140px}
#context-menu .menu-item{padding:4px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
#context-menu .menu-item:hover{background:#e8f0fe}
#context-menu .menu-item.danger{color:#e74c3c}
#context-menu .menu-sep{height:1px;background:#eee;margin:2px 0}
.color-swatch{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.color-swatch:hover{border-color:#333}
.color-swatch.selected{border-color:#333}
.color-picker-row{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;justify-content:flex-start;width:calc(5*24px + 4*4px)}
#inline-editor{position:absolute;display:none;z-index:110}
#node-quick-menu{position:absolute;display:none;z-index:120;background:#fff;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:2px 4px;gap:2px;flex-direction:row;align-items:center;white-space:nowrap}
#node-quick-menu .qm-item{padding:3px 8px;font-size:12px;cursor:pointer;border-radius:3px;color:#333;user-select:none;-webkit-user-select:none}
#node-quick-menu .qm-item:hover{background:#e8f0fe;color:#4A90D9}
#node-quick-menu .qm-more{font-weight:bold;font-size:15px;color:#4A90D9;border-left:1px solid #e0e0e0;margin-left:2px;padding-left:6px}
#node-quick-menu .qm-danger{color:#e74c3c}
#node-quick-menu .qm-danger:hover{background:#fef0ef;color:#c0392b}
#inline-editor textarea{font-family:'Microsoft YaHei','PingFang SC',sans-serif;border:none;outline:none;resize:none;background:#e8e8e8;box-shadow:0 0 0 1px rgba(74,144,217,.25);overflow:hidden;color:#333;white-space:pre;min-width:40px;min-height:20px}
</style>
</head>
<body>
<div id="toolbar">
  <button onclick="undo()" title="撤销 (Ctrl+Z)">↩</button>
  <button onclick="redo()" title="重做 (Ctrl+Y)">↪</button>
  <div class="sep"></div>
  <button onclick="addSibling()" title="添加同级节点 (Enter)">+ 同级</button>
  <button onclick="addChild()" title="添加子级节点 (Tab)">+ 子级</button>
  <div class="sep"></div>
  <div class="dropdown">
    <button onclick="toggleDropdown()" title="操作菜单">⚙ ▾</button>
    <div class="dropdown-menu" id="actionMenu">
      <div class="dropdown-item" onclick="closeDropdown();editNodeModal()">✏️ 编辑</div>
      <div class="dropdown-item danger" onclick="closeDropdown();deleteNode()">🗑️ 删除</div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item" onclick="closeDropdown();cutNode()">✂️ 剪切</div>
      <div class="dropdown-item" onclick="closeDropdown();copyNode()">📋 复制</div>
      <div class="dropdown-item" onclick="closeDropdown();pasteNode()">📌 粘贴</div>
    </div>
  </div>
  <span class="clip-info" id="clipInfo"></span>
  <div class="sep"></div>
  <button onclick="createNewMap()">+ 新建</button>
  <button onclick="exportText()">📤 导出</button>
  <button onclick="saveToLocal()">💾 保存</button>
  <button onclick="openFileManagerFrame()">📁 文件</button>
  <button onclick="syncCurrentFile()" id="syncBtn" title="同步当前文件到云端">☁ 同步</button>
  <button onclick="showSyncSettings()" title="同步设置">⚙</button>
  <span id="versionInfo" class="version-info"></span>
  <button onclick="collapseAll()">折叠</button>
  <button onclick="expandAll()">展开</button>
  <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="handleFile(event)">
</div>
<div id="zoom-panel">
  <button class="toggle-btn" onclick="toggleZoomPanel()" title="展开/收起">⚙</button>
  <div class="zoom-panel-inner">
    <button onclick="zoomIn()" title="放大 (+)">＋</button>
    <div class="zoom-info" id="zoomInfo">100%</div>
    <button onclick="zoomOut()" title="缩小 (−)">−</button>
    <div class="zoom-sep"></div>
    <button onclick="handleFitClick()" title="切换：适应全局 / 100%居中根标签">⊞</button>
    <button onclick="toggleFullscreen()" title="全屏 (F11)">⛶</button>
  </div>
</div>
<div id="viewport">
  <svg id="canvas">
    <defs>
      <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
      </filter>
    </defs>
    <g id="world"></g>
  </svg>
  <div id="inline-editor"><textarea></textarea></div>
  <div id="node-quick-menu">
    <div class="qm-item" data-action="edit">编辑</div>
    <div class="qm-item" data-action="cut">剪切</div>
    <div class="qm-item" data-action="copy">复制</div>
    <div class="qm-item" data-action="paste">粘贴</div>
    <div class="qm-item qm-danger" data-action="delete">删除</div>
    <div class="qm-item qm-more" data-action="more">+</div>
  </div>
</div>
<div id="edit-modal">
  <div class="modal-box">
    <h3>编辑节点</h3>
    <label>内容（首行加粗显示为标题，换行即正文）</label>
    <textarea id="editText" rows="5" placeholder="第一行是标题&#10;后续行是内容"></textarea>
    <div class="modal-btns">
      <button onclick="closeEdit()">取消</button>
      <button class="primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>
<div id="import-modal">
  <div class="modal-box">
    <h3>新建思维导图</h3>
    <label>粘贴缩进文本（Tab缩进表示层级，留空则创建默认结构）</label>
    <textarea id="importText" rows="8" placeholder="根节点&#10;&#9;子节点1&#9;补充说明\n&#10;第二行&#10;&#9;&#9;孙节点1"></textarea>
    <div class="modal-btns">
      <button onclick="closeImport()">取消</button>
      <button class="primary" onclick="doImport()">创建</button>
    </div>
  </div>
</div>
<div id="sync-modal">
  <div class="modal-box" style="width:400px;padding:14px 18px">
    <h3 style="font-size:15px;margin-bottom:10px">☁️ 云同步设置</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px">
      <div style="grid-column:1/-1">
        <label style="font-size:12px;margin-top:0">云函数地址</label>
        <input id="syncApiUrl" type="text" placeholder="https://..." style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px">
      </div>
      <div style="grid-column:1/-1">
        <label style="font-size:12px;margin-top:0">Webhook 地址</label>
        <input id="syncWebhookUrl" type="text" placeholder="https://www.kdocs.cn/api/v3/ide/file/..." style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px">
      </div>
      <div style="grid-column:1/-1">
        <label style="font-size:12px;margin-top:0">AirScript Token</label>
        <input id="syncToken" type="text" placeholder="可选" style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px">
      </div>
      <div>
        <label style="font-size:12px;margin-top:0">保存间隔(秒)</label>
        <input id="syncAutoSaveInterval" type="number" value="5" min="1" max="60" style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px">
      </div>
      <div>
        <label style="font-size:12px;margin-top:0">检查间隔(分)</label>
        <input id="syncCloudCheckInterval" type="number" value="5" min="1" max="60" style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px">
      </div>
      <div>
        <label style="font-size:12px;margin-top:0">同步差值</label>
        <input id="syncThreshold" type="number" value="5" min="1" max="20" style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px">
      </div>
      <div>
        <label style="font-size:12px;margin-top:0">重试次数</label>
        <input id="syncRetryCount" type="number" value="5" min="1" max="10" style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px">
      </div>
      <div>
        <label style="font-size:12px;margin-top:0">重试间隔(秒)</label>
        <input id="syncRetryInterval" type="number" value="2" min="1" max="10" style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px">
      </div>
      <div style="display:flex;align-items:center;gap:6px;grid-column:1/-1;margin-top:2px">
        <input id="syncEnabled" type="checkbox" checked>
        <label for="syncEnabled" style="margin:0;font-size:12px">启用云同步</label>
      </div>
    </div>
    <div class="modal-btns" style="margin-top:10px">
      <button onclick="closeSyncSettings()">取消</button>
      <button class="primary" onclick="saveSyncSettings()">保存</button>
    </div>
  </div>
</div>
<div id="sync-conflict-modal">
  <div class="modal-box" style="width:380px">
    <h3>⚠️ 版本冲突</h3>
    <p id="conflictDesc" style="font-size:13px;color:#666;margin:10px 0">版本不一致</p>
    <div style="background:#f5f5f5;padding:10px;border-radius:4px;font-size:12px;margin:10px 0">
      <div>本地版本：<span id="localVersion">-</span></div>
      <div>云端版本：<span id="cloudVersion">-</span></div>
    </div>
    <div class="modal-btns" id="conflictBtns">
      <button onclick="closeSyncConflict()">稍后处理</button>
      <button onclick="saveConflictVersion()">新建冲突版本</button>
      <button id="btnOverwriteCloud" onclick="overwriteCloudWithLocal()">用本地覆盖云端</button>
      <button id="btnReverseOverwrite" onclick="reverseOverwriteCloud()" style="display:none">反向覆盖云端</button>
      <button class="primary" onclick="acceptCloudVersion()">使用云端版本</button>
    </div>
  </div>
</div>
<div id="file-modal">
  <div class="modal-box" style="width:600px;max-height:80vh;display:flex;flex-direction:column">
    <h3>📁 文件管理</h3>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <input id="fileNameInput" type="text" placeholder="输入文件名" style="flex:1;min-width:120px;padding:6px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px">
      <button class="primary" onclick="saveNamedFile()">保存</button>
      <button onclick="renameCurrentFile()" title="重命名当前文件">重命名</button>
      <button onclick="copyCurrentFile()" title="复制当前文件">复制</button>
      <button onclick="loadFile();closeFileManager()" title="导入本地txt文件">📂 导入本地</button>
      <button onclick="exportText()" title="导出当前文件">📤 导出</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button onclick="syncAllFiles()" id="syncAllBtn" title="同步全部文件">☁️ 全部同步</button>
    </div>
    <div id="fileManagerFallback" style="flex:1;overflow-y:auto;min-height:100px">
      <div id="fileList" style="flex:1;overflow-y:auto;min-height:100px"></div>
    </div>
    <div id="fileSyncStatus" style="font-size:11px;color:#666;margin-top:6px;padding:4px 8px;background:#fafafa;border-radius:3px;display:none"></div>
    <div class="modal-btns" style="margin-top:10px">
      <button onclick="closeFileManager()">关闭</button>
    </div>
  </div>
</div>
<div id="context-menu">
  <div class="menu-item" onclick="addSibling()">➕ 添加同级</div>
  <div class="menu-item" onclick="addChild()">➕ 添加子级</div>
  <div class="menu-item" onclick="editNodeModal()">✏️ 编辑(弹窗)</div>
  <div class="menu-sep"></div>
  <div class="menu-item" onclick="moveNodeUp()">⬆ 上移</div>
  <div class="menu-item" onclick="moveNodeDown()">⬇ 下移</div>
  <div class="menu-sep"></div>
  <div class="menu-item" onclick="copyAsStructuredText()">📝 复制为结构文本</div>
  <div class="menu-sep"></div>
  <div id="color-picker-row" class="color-picker-row" style="display:none"></div>
  <div class="menu-sep" id="color-sep" style="display:none;"></div>
  <div class="menu-item" onclick="toggleCollapse()">🔄 折叠/展开</div>
</div>
<div id="toast"></div>
<script>
if('serviceWorker' in navigator){const swCode='self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request))})';const swBlob=new Blob([swCode],{type:'application/javascript'});const swUrl=URL.createObjectURL(swBlob);navigator.serviceWorker.register(swUrl).catch(()=>{})}
const SVG_NS='http://www.w3.org/2000/svg';
const H_GAP=70,V_GAP=2,NODE_PAD_H=8,NODE_PAD_V=2;
const FONT_SIZE=13,DESC_FONT_SIZE=12;
const FONT_STR=FONT_SIZE+'px Microsoft YaHei,PingFang SC,sans-serif';
const DESC_FONT_STR=DESC_FONT_SIZE+'px Microsoft YaHei,PingFang SC,sans-serif';
const LEVEL_COLORS=['#4A90D9','#50C878','#FF8C00','#E74C3C','#9B59B6','#1ABC9C','#E67E22','#7F8C8D'];
const BRANCH_COLORS=['#C0392B','#E67E22','#F1C40F','#27AE60','#2980B9','#8E44AD','#1ABC9C','#D35400','#2C3E50','#E74C3C','#16A085','#9B59B6','#3498DB','#E91E63','#795548','#00BCD4'];
const MAX_USED_COLORS=15;
const MAX_NODE_WIDTH=600;
const LINE_HEIGHT=FONT_SIZE+3;
const DESC_LINE_HEIGHT=DESC_FONT_SIZE+2;
const measureCtx=document.createElement('canvas').getContext('2d');

let root=null,selectedNode=null,nodeMap={};
let panX=0,panY=0,zoom=1;
let isPanning=false,panStartX=0,panStartY=0,panStartPanX=0,panStartPanY=0;
let isDragging=false,dragNode=null,dragStartX=0,dragStartY=0;
let longPressTimer=null;
let dropTarget=null;
let dropAction='child';
let isResizing=false,resizeNode=null,resizeStartX=0,resizeStartW=0;
let clickPendingNode=null;
let editingNodeId=null;
let clipboard=null;
let clipboardMode='';
let clipboardSourceNode=null;
let usedBranchColors=new Set();

let undoStack=[];
let redoStack=[];
const MAX_HISTORY=50;
let undoSuspended=false;

// ===================== 多文件同步监督 =====================
let activeFileName = null;  // 当前正在被同步监督的文件名
let isFileManagerOpen = false;  // 文件管理页面是否打开

// ===================== 云同步配置 =====================
const SYNC_CONFIG_KEY = 'mindmap_sync_config';

function genFileId(){return Math.floor(1000000000+Math.random()*9000000000).toString()}
let _networkTime=null;
let _networkTimeFetched=0;
function _applyServerDate(dateStr){
  if(!dateStr)return false;
  try{
    const t=new Date(dateStr).getTime();
    if(!isNaN(t)&&t>1600000000000){_networkTime=t;_networkTimeFetched=Date.now();return true}
  }catch(e){}
  return false;
}
async function getNetworkTime(){
  const now=Date.now();
  if(_networkTime&&now-_networkTimeFetched<300000)return _networkTime+(now-_networkTimeFetched);
  const tryUrls=[
    'https://worldtimeapi.org/api/timezone/Etc/UTC',
    'https://timeapi.io/api/time/current/zone?timeZone=UTC',
    'https://timeapi.io/api/Time/current/zone?timeZone=UTC'
  ];
  for(const url of tryUrls){
    try{
      const ctrl=new AbortController();
      const tid=setTimeout(()=>ctrl.abort(),4000);
      const res=await fetch(url,{signal:ctrl.signal});
      clearTimeout(tid);
      const dateHeader=res.headers.get('Date');
      if(dateHeader&&_applyServerDate(dateHeader))return _networkTime+(Date.now()-_networkTimeFetched);
      const data=await res.json();
      const timeField=data.utc_datetime||data.dateTime||data.datetime;
      if(timeField&&_applyServerDate(timeField+'Z'))return _networkTime+(Date.now()-_networkTimeFetched);
      if(data.unixtime){
        _networkTime=data.unixtime*1000;_networkTimeFetched=Date.now();
        return _networkTime+(Date.now()-_networkTimeFetched);
      }
    }catch(e){}
  }
  return Date.now();
}

function getSyncConfig() {
  if (!syncConfig) {
    try {
      const saved = localStorage.getItem(SYNC_CONFIG_KEY);
      syncConfig = saved ? JSON.parse(saved) : { ...DEFAULT_SYNC_CONFIG };
    } catch (e) {
      syncConfig = { ...DEFAULT_SYNC_CONFIG };
    }
  }
  return syncConfig;
}

function saveSyncConfig(config) {
  syncConfig = config;
  localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(config));
}

function getContentHash() {
  if (!root) return '';
  const text = exportNodeText(root).trimEnd();
  let hash = 0;
  for (let i = 0; i < text.length; i++) {
    const char = text.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return hash.toString();
}

function getFileMeta(name){
  try{
    const idx=getFileIndex();
    const f=idx.find(x=>x.name===name);
    if(!f)return{name,id:genFileId(),version:0,lastSyncVersion:0};
    if(!f.id){f.id=genFileId();setFileIndex(idx)}
    if(f.lastSyncVersion===undefined){f.lastSyncVersion=f.version||0;setFileIndex(idx)}
    return f;
  }catch(e){return{name,id:genFileId(),version:0,lastSyncVersion:0}}
}

function getFileVersion(name){
  const meta=getFileMeta(name||currentFileName);
  return meta.version||0;
}

function setFileVersion(name,ver){
  const idx=getFileIndex();
  const f=idx.find(x=>x.name===name);
  if(f){f.version=ver;setFileIndex(idx)}
}

function getLastSyncVersion(name){
  const meta=getFileMeta(name||currentFileName);
  return meta.lastSyncVersion||0;
}

function setLastSyncVersion(name,ver){
  const idx=getFileIndex();
  const f=idx.find(x=>x.name===name);
  if(f){f.lastSyncVersion=ver;setFileIndex(idx)}
}

function hasLocalEdits(name){
  const meta=getFileMeta(name||currentFileName);
  return (meta.version||0)!==(meta.lastSyncVersion||0);
}

function bumpFileVersion(name){
  const n=name||currentFileName;
  if(!n)return;
  const idx=getFileIndex();
  const f=idx.find(x=>x.name===n);
  if(f){f.version=(f.version||0)+1;setFileIndex(idx);opCountSinceSync++}
}

function getLastSyncTime(){
  try{return parseInt(localStorage.getItem('mindmap_last_sync_time')||'0')}catch(e){return 0}
}
function setLastSyncTime(t){
  lastSyncTime=t;
  localStorage.setItem('mindmap_last_sync_time',t.toString());
}

function updateVersionInfo(){
  const el=document.getElementById('versionInfo');
  if(!el)return;
  if(!currentFileName){el.textContent='';return}
  const ver=getFileVersion(currentFileName);
  el.textContent=currentFileName+' v'+ver;
}

// ===================== 云同步 API =====================
async function callCloudAPI(action, params = {}) {
  const config = getSyncConfig();
  if (!config.enabled) return { status: 'error', message: '云同步未启用', isNetworkError: false };

  const payload = {
    webhookUrl: config.webhookUrl,
    message: {
      Context: {
        argv: {
          表格名: config.sheetName,
          操作: action,
          ...params
        }
      }
    }
  };

  const headers = { 'Content-Type': 'application/json' };
  if (config.token) {
    headers['AirScript-Token'] = config.token;
  }

  const allUrls = [...PRIMARY_API_URLS, ...FALLBACK_API_URLS];
  const maxRetries = config.retryCount || 5;
  const retryInterval = config.retryInterval || 2;

  for (const apiUrl of allUrls) {
    let lastError = null;
    let lastIsNetworkError = true;

    for (let attempt = 0; attempt < maxRetries; attempt++) {
      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const dateHeader = response.headers.get('Date');
        if (dateHeader) _applyServerDate(dateHeader);

        const result = await response.json();
        console.log('[云同步] 原始返回:', JSON.stringify(result).slice(0, 500));

        const r = result.data?.result || result;
        console.log('[云同步] 解析后:', JSON.stringify(r).slice(0, 500));

        if (r.status === 'success') {
          console.log('[云同步] 业务成功:', r);
          return r;
        }

        if (r.tongzhi) {
          const netKeywords = ['网络','超时','timeout','ECONNRESET','ENOTFOUND','fetch','Failed to fetch','NetworkError','Network request'];
          const isNet = netKeywords.some(k => r.tongzhi.includes(k));
          if (!isNet) {
            console.log('[云同步] 业务错误(不重试):', r.tongzhi);
            return { ...r, isNetworkError: false };
          }
          lastError = new Error(r.tongzhi);
          lastIsNetworkError = true;
        } else {
          lastError = new Error(r.message || JSON.stringify(r).slice(0, 100) || '未知错误');
          lastIsNetworkError = true;
        }
      } catch (error) {
        lastError = error;
        lastIsNetworkError = true;
        console.log(`[云同步] ${apiUrl} 第${attempt + 1}次尝试失败:`, error.message);
      }

      if (attempt < maxRetries - 1) {
        await new Promise(resolve => setTimeout(resolve, retryInterval * 1000));
      }
    }

    console.log(`[云同步] ${apiUrl} 重试${maxRetries}次后失败，尝试下一个地址`);
  }

  return { status: 'error', message: lastError?.message || '所有云函数地址均不可用', isNetworkError: lastIsNetworkError };
}

async function findFirstEmptyRow(){
  const result=await callCloudAPI('获取维度');
  if(result.status==='success'&&result.最大行)return result.最大行+1;
  return 2;
}

async function findFileInCloudById(fileId){
  if(!fileId)return{file:null,networkOk:false};
  const result=await callCloudAPI('查找',{列名:'ID',关键字:fileId});
  if(result.status==='success'){
    if(result.匹配数>0)return{file:result.数据[0],networkOk:true};
    return{file:null,networkOk:true};
  }
  if(result.isNetworkError===false)return{file:null,networkOk:true};
  return{file:null,networkOk:false};
}

async function findFileInCloud(fileName) {
  const name = fileName || currentFileName || '';
  const result = await callCloudAPI('查找', { 列名: '文件名', 关键字: name });
  if (result.status === 'success' && result.匹配数 > 0) {
    return result.数据[0];
  }
  return null;
}

async function uploadCurrentFile(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return{status:'error',message:'未启用',isNetworkError:false}}
  if(!currentFileName||!root){toast('请先保存文件');return{status:'error',message:'无文件',isNetworkError:false}}
  const fileName=currentFileName;
  const content=exportNodeText(root).trimEnd();
  const localVer=getFileVersion(fileName);
  const meta=getFileMeta(fileName);
  const netTime=await getNetworkTime();
  updateSyncButton('🔄');
  const cloudResult=await findFileInCloudById(meta.id);
  if(!cloudResult.networkOk){
    updateSyncButton('❌');
    setTimeout(()=>updateSyncButton('☁️'),2000);
    toast('网络异常，无法确认云端状态');
    return{status:'error',message:'网络异常',isNetworkError:true};
  }
  if(!cloudResult.file){
    const newRow=await findFirstEmptyRow();
    const writeResult=await callCloudAPI('批量写入',{
      行号:newRow,
      数据:{ID:meta.id,文件名:fileName,内容:content,版本号:localVer.toString(),更新时间:new Date(netTime).toISOString()}
    });
    if(writeResult.status!=='success'){
      toast('云端新建失败：'+(writeResult.tongzhi||writeResult.message||'未知错误'));
      updateSyncButton('❌');
      setTimeout(()=>updateSyncButton('☁️'),2000);
      return{status:'error',message:'云端新建失败',isNetworkError:!!writeResult.isNetworkError};
    }
    setLastSyncTime(Date.now());
    setLastSyncVersion(fileName,localVer);
    opCountSinceSync=0;
    lastContentHash=getContentHash();
    updateSyncButton('✅');
    setTimeout(()=>updateSyncButton('☁️'),2000);
    updateVersionInfo();
    toast('已新建云端文件，版本: '+localVer);
    return{status:'success',version:localVer};
  }
  const existingFile=cloudResult.file;
  const cloudVer=parseInt(existingFile.版本号||'0');
  if(cloudVer===localVer){
    setLastSyncTime(Date.now());
    updateSyncButton('☁️');
    toast('云端已是最新');
    return{status:'no_update',version:localVer};
  }
  if(cloudVer>localVer){
    pendingCloudVersion=cloudVer;
    showSyncConflict(cloudVer,'upload');
    updateSyncButton('☁️');
    return{status:'conflict',message:'云端版本更高'};
  }
  const writeResult=await callCloudAPI('批量写入',{
    行号:existingFile._行号,
    数据:{ID:meta.id,文件名:fileName,内容:content,版本号:localVer.toString(),更新时间:new Date(netTime).toISOString()}
  });
  if(writeResult.status!=='success'){
    toast('上传失败：'+(writeResult.tongzhi||writeResult.message||'未知错误'));
    updateSyncButton('❌');
    setTimeout(()=>updateSyncButton('☁️'),2000);
    return{status:'error',message:'上传失败',isNetworkError:!!writeResult.isNetworkError};
  }
  setLastSyncTime(Date.now());
  setLastSyncVersion(fileName,localVer);
  opCountSinceSync=0;
  lastContentHash=getContentHash();
  updateSyncButton('✅');
  setTimeout(()=>updateSyncButton('☁️'),2000);
  updateVersionInfo();
  toast('已上传覆盖云端，版本: '+localVer);
  return{status:'success',version:localVer};
}

async function downloadCurrentFile(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return{status:'error',message:'未启用',isNetworkError:false}}
  if(!currentFileName){toast('请先打开文件');return{status:'error',message:'无文件',isNetworkError:false}}
  const fileName=currentFileName;
  const localVer=getFileVersion(fileName);
  const meta=getFileMeta(fileName);
  updateSyncButton('🔄');
  const cloudResult=await findFileInCloudById(meta.id);
  if(!cloudResult.networkOk){
    updateSyncButton('❌');
    setTimeout(()=>updateSyncButton('☁️'),2000);
    toast('网络异常，无法确认云端状态');
    return{status:'error',message:'网络异常',isNetworkError:true};
  }
  if(!cloudResult.file){
    updateSyncButton('☁️');
    toast('云端无此文件');
    return{status:'no_file',message:'云端无此文件'};
  }
  const existingFile=cloudResult.file;
  const cloudVer=parseInt(existingFile.版本号||'0');
  if(cloudVer<=localVer){
    updateSyncButton('☁️');
    toast('本地版本更高或相同，无需下载');
    return{status:'no_update',version:localVer};
  }
  if(hasLocalEdits(fileName)){
    pendingCloudVersion=cloudVer;
    showSyncConflict(cloudVer,'download_has_edits');
    updateSyncButton('☁️');
    return{status:'conflict',message:'本地有未同步编辑，云端版本更高'};
  }
  const content=existingFile.内容||'';
  pushHistory();
  root=parseText(content);
  selectedNode=null;
  rebuildMap();render();
  setFileVersion(fileName,cloudVer);
  setLastSyncVersion(fileName,cloudVer);
  lastContentHash=getContentHash();
  localStorage.setItem('mindmap_data',content);
  saveFileData(fileName,content);
  setLastSyncTime(Date.now());
  opCountSinceSync=0;
  updateSyncButton('✅');
  setTimeout(()=>updateSyncButton('☁️'),2000);
  toast('已下载，版本: '+cloudVer);
  return{status:'success',version:cloudVer};
}

let syncMutex=false;
let syncQueue=[];
let conflictResolver=null;
function enqueueSync(fn,label){
  return new Promise((resolve,reject)=>{
    syncQueue.push({fn,label,resolve,reject});
    processSyncQueue();
  });
}
function processSyncQueue(){
  if(syncMutex||syncQueue.length===0)return;
  const task=syncQueue.shift();
  syncMutex=true;
  task.fn().then(task.resolve).catch(task.reject).finally(()=>{
    syncMutex=false;
    processSyncQueue();
  });
}

async function syncCurrentFile(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return}
  if(!currentFileName||!root){toast('请先保存文件');return}
  if(syncMutex){toast('同步排队中，请稍候')}
  await enqueueSync(async()=>{
    updateSyncButton('🔄');
    try{
      const dlResult=await downloadCurrentFile();
      if(dlResult.status==='conflict'){
        await new Promise(resolve=>{conflictResolver=resolve});
      }
      await uploadCurrentFile();
    }finally{
      conflictResolver=null;
    }
  },'单文件同步');
}

async function autoSyncCurrentFile(){
  const config=getSyncConfig();
  if(!config.enabled)return;
  if(!currentFileName||!root)return;
  if(syncMutex)return;
  const cooldownMs=(config.autoSaveInterval||5)*1000;
  if(Date.now()-getLastSyncTime()<cooldownMs)return;
  await enqueueSync(async()=>{
    updateSyncButton('🔄');
    try{
      const dlResult=await downloadCurrentFile();
      if(dlResult.status==='conflict'){
        await new Promise(resolve=>{conflictResolver=resolve});
      }
      await uploadCurrentFile();
    }finally{
      conflictResolver=null;
    }
  },'自动同步');
}

  const autoSaveInterval = parseInt(document.getElementById('syncAutoSaveInterval').value) || 5;
  const cloudCheckInterval = parseInt(document.getElementById('syncCloudCheckInterval').value) || 5;
  if(cloudCheckInterval * 60 <= autoSaveInterval){
    toast('检查间隔(分)必须大于保存间隔(秒)');
    return;
  }
  const config = {
    enabled: document.getElementById('syncEnabled').checked,
    apiUrl: document.getElementById('syncApiUrl').value.trim() || PRIMARY_API_URLS[0],
    webhookUrl: document.getElementById('syncWebhookUrl').value.trim(),
    token: document.getElementById('syncToken').value.trim(),
    autoSaveInterval: autoSaveInterval,
    cloudCheckInterval: cloudCheckInterval,
    syncThreshold: parseInt(document.getElementById('syncThreshold').value) || 5,
    retryCount: parseInt(document.getElementById('syncRetryCount').value) || 5,
    retryInterval: parseInt(document.getElementById('syncRetryInterval').value) || 2,
    sheetName: '自用脑图'
  };
  saveSyncConfig(config);
  closeSyncSettings();
  restartSyncTimers();
  toast('同步设置已保存');
}

// ===================== 冲突处理 =====================
let conflictContext='';
function showSyncConflict(cloudVer,context) {
  document.getElementById('localVersion').textContent = getFileVersion(currentFileName);
  document.getElementById('cloudVersion').textContent = cloudVer;
  conflictContext=context||'';
  const desc=document.getElementById('conflictDesc');
  const lastSync=getLastSyncVersion(currentFileName);
  const btnOverwrite=document.getElementById('btnOverwriteCloud');
  const btnReverse=document.getElementById('btnReverseOverwrite');
  if(context==='upload'){
    desc.textContent='云端版本更高，如何处理？';
    btnOverwrite.style.display='';
    btnReverse.style.display='none';
  }else if(context==='download_has_edits'){
    desc.textContent='本地有未同步编辑(上次同步v'+lastSync+')，云端版本更高，如何处理？';
    btnOverwrite.style.display='';
    btnReverse.style.display='';
  }else{
    desc.textContent='版本不一致，如何处理？';
    btnOverwrite.style.display='';
    btnReverse.style.display='none';
  }
  document.getElementById('sync-conflict-modal').classList.add('show');
}

function closeSyncConflict() {
  document.getElementById('sync-conflict-modal').classList.remove('show');
  pendingCloudVersion = null;
  conflictContext='';
  if(conflictResolver){
    const r=conflictResolver;
    conflictResolver=null;
    r();
  }
}

async function acceptCloudVersion() {
  const fileName = currentFileName || '';
  const meta = getFileMeta(fileName);
  const cloudResult = await findFileInCloudById(meta.id);
  if (!cloudResult.networkOk) {
    toast('网络异常，无法获取云端文件');
    closeSyncConflict();
    return;
  }
  if (cloudResult.file) {
    const content = cloudResult.file.内容 || '';
    pushHistory();
    root = parseText(content);
    selectedNode = null;
    rebuildMap();
    render();
    const cloudVer=parseInt(cloudResult.file.版本号||'0');
    setFileVersion(fileName,cloudVer);
    setLastSyncVersion(fileName,cloudVer);
    lastContentHash = getContentHash();
    localStorage.setItem('mindmap_data', content);
    saveFileData(fileName, content);
    setLastSyncTime(Date.now());
    opCountSinceSync=0;
    toast('已更新为云端版本');
  }
  closeSyncConflict();
}

async function saveConflictVersion() {
  if(!currentFileName){closeSyncConflict();return}
  const netTime=await getNetworkTime();
  const ts=new Date(netTime).toISOString().replace(/[-:T]/g,'').substring(0,14);
  const conflictName=currentFileName.replace('.txt','')+'冲突版本'+ts+'.txt';
  const content=exportNodeText(root).trimEnd();
  const conflictId=genFileId();
  saveFileData(conflictName,content);
  const idx=getFileIndex();
  const f=idx.find(x=>x.name===conflictName);
  if(f){f.id=conflictId;f.version=1;f.lastSyncVersion=1;setFileIndex(idx)}
  const newRow=await findFirstEmptyRow();
  const writeResult=await callCloudAPI('批量写入',{
    行号:newRow,
    数据:{ID:conflictId,文件名:conflictName,内容:content,版本号:'1',更新时间:new Date(netTime).toISOString()}
  });
  if(writeResult.status==='success'){
    setLastSyncTime(Date.now());
    setLastSyncVersion(conflictName,1);
  }
  openNamedFile(conflictName);
  toast('已创建冲突版本: '+conflictName);
  closeSyncConflict();
}

async function overwriteCloudWithLocal(){
  const fileName=currentFileName||'';
  const content=exportNodeText(root).trimEnd();
  const localVer=getFileVersion(fileName);
  const meta=getFileMeta(fileName);
  const cloudVer=pendingCloudVersion||0;
  const newVersion=Math.max(localVer,cloudVer);
  const netTime=await getNetworkTime();
  const cloudResult=await findFileInCloudById(meta.id);
  if(!cloudResult.networkOk){
    toast('网络异常，无法确认云端状态');
    closeSyncConflict();
    return;
  }
  let writeResult;
  if(cloudResult.file){
    writeResult=await callCloudAPI('批量写入',{
      行号:cloudResult.file._行号,
      数据:{ID:meta.id,文件名:fileName,内容:content,版本号:newVersion.toString(),更新时间:new Date(netTime).toISOString()}
    });
  }else{
    const newRow=await findFirstEmptyRow();
    writeResult=await callCloudAPI('批量写入',{
      行号:newRow,
      数据:{ID:meta.id,文件名:fileName,内容:content,版本号:newVersion.toString(),更新时间:new Date(netTime).toISOString()}
    });
  }
  if(writeResult.status==='success'){
    setFileVersion(fileName,newVersion);
    setLastSyncVersion(fileName,newVersion);
    lastContentHash=getContentHash();
    setLastSyncTime(Date.now());
    opCountSinceSync=0;
    updateVersionInfo();
    toast('已用本地版本覆盖云端，版本: '+newVersion);
  }else{
    toast('覆盖云端失败：'+(writeResult.tongzhi||writeResult.message||'未知错误'));
  }
  closeSyncConflict();
}

async function reverseOverwriteCloud(){
  const fileName=currentFileName||'';
  const content=exportNodeText(root).trimEnd();
  const meta=getFileMeta(fileName);
  const cloudVer=pendingCloudVersion||0;
  const netTime=await getNetworkTime();
  const cloudResult=await findFileInCloudById(meta.id);
  if(!cloudResult.networkOk){
    toast('网络异常，无法确认云端状态');
    closeSyncConflict();
    return;
  }
  const newVer=cloudVer+1;
  let writeResult;
  if(cloudResult.file){
    writeResult=await callCloudAPI('批量写入',{
      行号:cloudResult.file._行号,
      数据:{ID:meta.id,文件名:fileName,内容:content,版本号:newVer.toString(),更新时间:new Date(netTime).toISOString()}
    });
  }else{
    const newRow=await findFirstEmptyRow();
    writeResult=await callCloudAPI('批量写入',{
      行号:newRow,
      数据:{ID:meta.id,文件名:fileName,内容:content,版本号:newVer.toString(),更新时间:new Date(netTime).toISOString()}
    });
  }
  if(writeResult.status==='success'){
    setFileVersion(fileName,newVer);
    setLastSyncVersion(fileName,newVer);
    lastContentHash=getContentHash();
    setLastSyncTime(Date.now());
    opCountSinceSync=0;
    updateVersionInfo();
    toast('已反向覆盖云端，版本矫正为: '+newVer);
  }else{
    toast('反向覆盖失败：'+(writeResult.tongzhi||writeResult.message||'未知错误'));
  }
  closeSyncConflict();
}

// ===================== 自动同步 =====================
function startSyncTimers() {
  stopSyncTimers();
  const config = getSyncConfig();
  if (!config.enabled) return;

  autoSaveTimer = setInterval(() => {
    if (!root||!currentFileName) return;
    const now = Date.now();
    const cooldownMs = (config.autoSaveInterval || 5) * 1000;
    if (now - lastSaveTime < cooldownMs) return;
    const currentHash = getContentHash();
    if (currentHash !== lastContentHash) {
      const text = exportNodeText(root).trimEnd();
      localStorage.setItem('mindmap_data', text);
      saveFileData(currentFileName, text);
      lastSaveTime = now;
      lastContentHash = currentHash;
      const threshold = config.syncThreshold || 5;
      if (opCountSinceSync >= threshold && (now - getLastSyncTime()) >= cooldownMs) {
        autoSyncCurrentFile().catch(()=>{});
      }
    }
  }, 1000);

  cloudCheckTimer = setInterval(() => {
    if (!currentFileName) return;
    if (syncMutex) return;
    const now = Date.now();
    const checkIntervalMs = (config.cloudCheckInterval || 5) * 60 * 1000;
    const saveIntervalMs = (config.autoSaveInterval || 5) * 1000;
    if (checkIntervalMs <= saveIntervalMs) return;
    if (now - getLastSyncTime() >= checkIntervalMs) {
      autoSyncCurrentFile().catch(()=>{});
    }
  }, 60000);
}

function stopSyncTimers() {
  if (autoSaveTimer) { clearInterval(autoSaveTimer); autoSaveTimer = null; }
  if (cloudCheckTimer) { clearInterval(cloudCheckTimer); cloudCheckTimer = null; }
}

function restartSyncTimers() { startSyncTimers(); }

// ===================== 初始化表头 =====================
async function initSyncSheet() {
  const config = getSyncConfig();
  if (!config.enabled) return;

  try {
    // 先检查表头是否已存在
    const headersResult = await callCloudAPI('获取表头');
    if (headersResult.status === 'success') {
      const existingHeaders = headersResult.表头 || [];
      const requiredHeaders = ['ID', '文件名', '内容', '版本号', '更新时间'];
      const hasAllHeaders = requiredHeaders.every(h => existingHeaders.includes(h));

      if (hasAllHeaders) {
        console.log('云端表头已存在且完整');
        return;
      }
    }

    // 需要初始化表头
    const requiredHeaders = ['ID', '文件名', '内容', '版本号', '更新时间'];
    const result = await callCloudAPI('初始化表头', { 表头: requiredHeaders });
    if (result.status === 'success') {
      console.log('已初始化云端表头');
    } else {
      console.log('初始化表头失败:', result.tongzhi || result.message);
    }
  } catch (error) {

  }
}

function getNodePath(node){
  if(!node)return null;
  const path=[];
  let n=node;
  while(n.parent){
    path.unshift(n.parent.children.indexOf(n));
    n=n.parent;
  }
  return path.join('.');
}

function findNodeByPath(pathStr){
  if(!root||!pathStr)return null;
  const parts=pathStr.split('.').map(Number);
  let n=root;
  for(const idx of parts){
    if(!n.children||!n.children[idx])return null;
    n=n.children[idx];
  }
  return n;
}

function captureState(){
  if(!root)return null;
  return{
    text:exportNodeText(root).trimEnd(),
    selectedPath:getNodePath(selectedNode)
  };
}

function pushHistory(){
  if(undoSuspended)return;
  const state=captureState();
  if(!state)return;
  undoStack.push(state);
  if(undoStack.length>MAX_HISTORY)undoStack.shift();
  redoStack=[];
  bumpFileVersion(currentFileName);
}

function restoreState(state){
  if(!state)return;
  undoSuspended=true;
  root=parseText(state.text);
  selectedNode=null;
  rebuildMap();
  if(state.selectedPath){
    const found=findNodeByPath(state.selectedPath);
    if(found)selectedNode=found;
  }
  render();
  if(selectedNode)centerOnNode(selectedNode);
  undoSuspended=false;
}

function undo(){
  if(undoStack.length===0){toast('没有可撤销的操作');return}
  const current=captureState();
  redoStack.push(current);
  const state=undoStack.pop();
  restoreState(state);
  bumpFileVersion(currentFileName);
  toast('撤销');
}

function redo(){
  if(redoStack.length===0){toast('没有可重做的操作');return}
  const current=captureState();
  undoStack.push(current);
  const state=redoStack.pop();
  restoreState(state);
  bumpFileVersion(currentFileName);
  toast('重做');
}

function centerOnNode(node){
  const vp=document.getElementById('viewport');
  const vw=vp.clientWidth,vh=vp.clientHeight;
  panX=vw/2-node.x*zoom-node.width*zoom/2;
  panY=vh/2-node.y*zoom;
  updateTransform();
}

class MindNode{
  constructor(text){
    this.id=MindNode._nextId++;
    this.text=text||'';
    this.children=[];
    this.parent=null;
    this.collapsed=false;
    this.x=0;this.y=0;this.width=0;this.height=0;this.subtreeH=0;
    this.displayLines=[];
    this.titleLineCount=0;
    this.customWidth=0;
  }
  addChild(c){c.parent=this;this.children.push(c)}
  removeChild(c){const i=this.children.indexOf(c);if(i>=0){this.children.splice(i,1);c.parent=null}}
  insertAfter(newNode,refNode){const i=this.children.indexOf(refNode);this.children.splice(i+1,0,newNode);newNode.parent=this}
  isDescendantOf(n){let p=this;while(p){if(p===n)return true;p=p.parent}return false}
  countDescendants(){let c=0;for(const ch of this.children){c+=1+ch.countDescendants()}return c}
  firstLine(){const i=this.text.indexOf('\n');return i>=0?this.text.substring(0,i):this.text}
}
MindNode._nextId=1;

function getLevel(node){let l=0,p=node.parent;while(p){l++;p=p.parent}return l}
function getAncestorBranch(node){
  if(getLevel(node)<1)return null;
  if(getLevel(node)===1)return node;
  let p=node.parent;
  while(p&&getLevel(p)>1)p=p.parent;
  return p;
}
function getNodeBranchColor(node){
  if(node._userColor)return node._userColor;
  if(node._branchColor)return node._branchColor;
  if(node.parent)return getNodeBranchColor(node.parent);
  return null;
}
function pickBranchColor(avoidColor){
  let pool;
  if(usedBranchColors.size<MAX_USED_COLORS){
    pool=BRANCH_COLORS.filter(c=>!usedBranchColors.has(c)&&c!==avoidColor);
  }else{
    pool=BRANCH_COLORS.filter(c=>c!==avoidColor);
  }
  if(pool.length===0)pool=BRANCH_COLORS.slice();
  const c=pool[Math.floor(Math.random()*pool.length)];
  usedBranchColors.add(c);
  return c;
}
function setUserColor(node,color){
  node._userColor=color;
  for(const child of node.children)setUserColor(child,color);
}
function getColor(node){
  const level=getLevel(node);
  if(level>=1){
    const bc=getNodeBranchColor(node);
    return bc||BRANCH_COLORS[0];
  }
  return LEVEL_COLORS[0];
}

function wrapText(text,font,maxWidth){
  measureCtx.font=font;
  const lines=[];
  const paragraphs=text.split('\n');
  for(const para of paragraphs){
    if(!para){lines.push('');continue}
    let line='';
    for(let i=0;i<para.length;i++){
      const test=line+para[i];
      if(measureCtx.measureText(test).width>maxWidth&&line){
        lines.push(line);line=para[i];
      }else{line=test}
    }
    if(line)lines.push(line);
  }
  return lines;
}

function parseText(text){
  MindNode._nextId=1;
  // 兼容 \r\n, \r, \n 三种换行符
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const vRoot=new MindNode('__v__');
  const stack=[{node:vRoot,level:-1}];
  for(const line of lines){
    if(!line.trim())continue;
    let level=0;
    while(level<line.length&&line[level]==='\t')level++;
    const content=line.substring(level);
    const ti=content.indexOf('\t');
    let nodeText,collapsed=false,customWidth=0,parsedColor=null;
    function parseTitle(raw){
      let s=raw.trim();
      const wm=s.match(/ ◆(\d+)$/);
      if(wm){customWidth=parseInt(wm[1]);s=s.slice(0,-wm[0].length)}
      const cm=s.match(/ ★([^ ]+)$/);
      if(cm){parsedColor=cm[1];s=s.slice(0,-cm[0].length)}
      if(s.endsWith('◈')){collapsed=true;s=s.slice(0,-1).trimEnd()}
      s=s.replace(/\\n/g,'\n');
      return s;
    }
    if(ti>=0){
      const title=parseTitle(content.substring(0,ti));
      const desc=content.substring(ti+1).replace(/\\n/g,'\n').trim();
      nodeText=desc?title+'\n'+desc:title;
    }else{
      nodeText=parseTitle(content);
    }
    if(!nodeText)continue;
    const node=new MindNode(nodeText);
    node.collapsed=collapsed;
    node.customWidth=customWidth;
    while(stack.length>1&&stack[stack.length-1].level>=level)stack.pop();
    stack[stack.length-1].node.addChild(node);
    if(parsedColor){
      if(getLevel(node)===1){node._branchColor=parsedColor}
      else{node._userColor=parsedColor}
    }
    stack.push({node,level});
  }
  if(vRoot.children.length===1){const r=vRoot.children[0];r.parent=null;return r}
  if(vRoot.children.length>1){vRoot.text=currentFileName?currentFileName.replace(/\.txt$/,''):'根节点';return vRoot}
  return new MindNode('空思维导图');
}

function exportNodeText(node,indent=0){
  const nlIdx=node.text.indexOf('\n');
  const collapseMark=node.collapsed?' ◈':'';
  const widthMark=node.customWidth>0?' ◆'+node.customWidth:'';
  const level=getLevel(node);
  const colorMark=(level>=1&&(node._branchColor||node._userColor))?' ★'+(node._userColor||node._branchColor):'';
  let line;
  if(nlIdx>=0){
    const title=node.text.substring(0,nlIdx)+collapseMark+colorMark+widthMark;
    const desc=node.text.substring(nlIdx+1).replace(/\n/g,'\\n');
    line='\t'.repeat(indent)+title+'\t'+desc;
  }else{
    line='\t'.repeat(indent)+node.text+collapseMark+colorMark+widthMark;
  }
  let result=line+'\n';
  for(const c of node.children)result+=exportNodeText(c,indent+1);
  return result;
}

function measureNode(node){
  const effectiveMaxW=node.customWidth>0?node.customWidth:MAX_NODE_WIDTH;
  const innerW=effectiveMaxW-NODE_PAD_H*2;
  const rawLines=node.text.split('\n');
  node.displayLines=[];
  node.titleLineCount=0;
  for(let p=0;p<rawLines.length;p++){
    const font=p===0?FONT_STR:DESC_FONT_STR;
    const wrapped=wrapText(rawLines[p],font,innerW);
    if(p===0)node.titleLineCount=wrapped.length;
    for(const wl of wrapped)node.displayLines.push({text:wl,isTitle:p===0});
  }
  if(node.displayLines.length===0){
    node.displayLines=[{text:'(空)',isTitle:true}];
    node.titleLineCount=1;
  }
  let maxLineW=0;
  for(const dl of node.displayLines){
    measureCtx.font=dl.isTitle?FONT_STR:DESC_FONT_STR;
    maxLineW=Math.max(maxLineW,measureCtx.measureText(dl.text).width);
  }
  node.width=Math.max(maxLineW+NODE_PAD_H*2,60);
  if(node.customWidth>0)node.width=Math.max(node.customWidth,60);
  else node.width=Math.min(node.width,MAX_NODE_WIDTH);
  let h=NODE_PAD_V;
  for(const dl of node.displayLines){
    h+=dl.isTitle?LINE_HEIGHT:DESC_LINE_HEIGHT;
  }
  h+=NODE_PAD_V;
  node.height=h;
}

function computeSubtreeH(node){
  measureNode(node);
  if(node.collapsed||node.children.length===0){node.subtreeH=node.height;return node.subtreeH}
  let total=0;
  for(const c of node.children)total+=computeSubtreeH(c);
  total+=V_GAP*(node.children.length-1);
  node.subtreeH=Math.max(node.height,total);
  return node.subtreeH;
}

function layoutNode(node,x,yStart,yEnd){
  node.x=x;node.y=(yStart+yEnd)/2;
  if(node.collapsed||node.children.length===0)return;
  const childX=x+node.width+H_GAP;
  let childrenH=0;
  for(const c of node.children)childrenH+=c.subtreeH;
  childrenH+=V_GAP*(node.children.length-1);
  let curY=node.y-childrenH/2;
  if(curY<yStart)curY=yStart;
  for(const c of node.children){
    layoutNode(c,childX,curY,curY+c.subtreeH);
    curY+=c.subtreeH+V_GAP;
  }
}

function rebuildMap(){
  nodeMap={};
  if(!root)return;
  computeSubtreeH(root);
  layoutNode(root,60,0,root.subtreeH);
  indexNodes(root);
}
function indexNodes(node){nodeMap[node.id]=node;if(!node.collapsed)for(const c of node.children)indexNodes(c)}

function renderConns(node,container){
  if(node.collapsed)return;
  for(const child of node.children){
    const path=document.createElementNS(SVG_NS,'path');
    const x1=node.x+node.width,y1=node.y;
    const x2=child.x,y2=child.y;
    const cx=(x1+x2)/2;
    path.setAttribute('d',`M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`);
    path.setAttribute('stroke',getColor(child));
    path.setAttribute('stroke-width','2');
    path.setAttribute('fill','none');
    path.setAttribute('opacity','0.45');
    container.appendChild(path);
    renderConns(child,container);
  }
}

function renderNodeContent(node,g,offsetX,offsetY,opacity){
  let curY=node.y-node.height/2+NODE_PAD_V+offsetY;
  for(const dl of node.displayLines){
    const t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('x',node.x+NODE_PAD_H+2+offsetX);
    t.setAttribute('y',curY+(dl.isTitle?LINE_HEIGHT:DESC_LINE_HEIGHT)/2);
    if(dl.isTitle){
      t.setAttribute('font-size',FONT_SIZE);t.setAttribute('font-weight','bold');
      t.setAttribute('fill','#333');
    }else{
      t.setAttribute('font-size',DESC_FONT_SIZE);
      t.setAttribute('fill','#666');
    }
    t.setAttribute('dominant-baseline','middle');
    if(opacity!==undefined)t.setAttribute('opacity',opacity);
    t.textContent=dl.text;
    g.appendChild(t);
    curY+=dl.isTitle?LINE_HEIGHT:DESC_LINE_HEIGHT;
  }
}

function renderNodes(node,container){
  const g=document.createElementNS(SVG_NS,'g');
  g.setAttribute('class','mind-node'+(selectedNode===node?' selected':''));
  g.setAttribute('data-id',node.id);

  const rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('class','node-bg');
  rect.setAttribute('x',node.x);rect.setAttribute('y',node.y-node.height/2);
  rect.setAttribute('width',node.width);rect.setAttribute('height',node.height);
  rect.setAttribute('rx','4');rect.setAttribute('fill','#e8e8e8');
  g.appendChild(rect);

  const bar=document.createElementNS(SVG_NS,'rect');
  bar.setAttribute('x',node.x);bar.setAttribute('y',node.y-node.height*0.4);
  bar.setAttribute('width','4');bar.setAttribute('height',node.height*0.8);
  bar.setAttribute('rx','2');bar.setAttribute('fill',getColor(node));
  g.appendChild(bar);

  renderNodeContent(node,g,0,0);

  if(node.children.length>0){
    const btn=document.createElementNS(SVG_NS,'g');
    btn.setAttribute('class','collapse-btn');btn.setAttribute('data-collapse',node.id);
    const bx=node.x+node.width+12,by=node.y;
    const bg=document.createElementNS(SVG_NS,'circle');
    bg.setAttribute('cx',bx);bg.setAttribute('cy',by);bg.setAttribute('r','9');
    bg.setAttribute('fill','#e8e8e8');
    btn.appendChild(bg);
    const sign=document.createElementNS(SVG_NS,'text');
    sign.setAttribute('x',bx);sign.setAttribute('y',by+1);sign.setAttribute('text-anchor','middle');
    sign.setAttribute('dominant-baseline','middle');sign.setAttribute('font-size','13');
    sign.setAttribute('fill',getColor(node));sign.setAttribute('font-weight','bold');
    sign.textContent=node.collapsed?'+':'−';
    btn.appendChild(sign);
    if(node.collapsed){
      const count=document.createElementNS(SVG_NS,'text');
      count.setAttribute('x',bx);count.setAttribute('y',by+15);
      count.setAttribute('text-anchor','middle');count.setAttribute('font-size','9');
      count.setAttribute('fill','#999');count.textContent=node.countDescendants();
      btn.appendChild(count);
    }
    g.appendChild(btn);
  }

  if(selectedNode===node){
    const handle=document.createElementNS(SVG_NS,'rect');
    handle.setAttribute('class','resize-handle');

  container.appendChild(g);

function fitScreen(){
  if(!root)return;
  const vp=document.getElementById('viewport');
  const vw=vp.clientWidth,vh=vp.clientHeight;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  function bounds(n){
    minX=Math.min(minX,n.x);minY=Math.min(minY,n.y-n.height/2);
    maxX=Math.max(maxX,n.x+n.width);maxY=Math.max(maxY,n.y+n.height/2);
    if(!n.collapsed)for(const c of n.children)bounds(c);
  }
  bounds(root);
  const tw=maxX-minX+100,th=maxY-minY+100;
  zoom=Math.min(vw/tw,vh/th,2);zoom=Math.max(zoom,0.1);
  panX=vw/2-(minX+tw/2-50)*zoom;
  panY=vh/2-(minY+th/2-50)*zoom;
  render();
}

function addChild(){
  if(!selectedNode){toast('请先选择节点');return}
  const node=new MindNode('新节点');
  pushHistory();
  selectedNode.addChild(node);
  if(selectedNode.collapsed)selectedNode.collapsed=false;
  const lvl=getLevel(node);
  if(lvl>=1){
    if(lvl===1){
      node._branchColor=pickBranchColor(null);
    } else {
      node._branchColor=getNodeBranchColor(selectedNode);
    }
    usedBranchColors.add(node._branchColor);
  }
  rebuildMap();render();selectNode(node);startInlineEdit(node,true);
}

function addSibling(){
  if(!selectedNode||!selectedNode.parent){toast('根节点无法添加同级');return}
  const node=new MindNode('新节点');
  pushHistory();
  selectedNode.parent.insertAfter(node,selectedNode);
  const lvl=getLevel(node);
  if(lvl>=1){
    if(lvl===1){
      node._branchColor=pickBranchColor(null);
    } else {
      node._branchColor=getNodeBranchColor(selectedNode);
    }
    usedBranchColors.add(node._branchColor);
  }
  rebuildMap();render();selectNode(node);startInlineEdit(node,true);
}

let inlineEditNode=null;
let skipInlineHistory=false;
function startInlineEdit(node,skipHistory,cursorOffset){
    finishInlineEdit();
    inlineEditNode=node;
    skipInlineHistory=!!skipHistory;
  const vp=document.getElementById('viewport');
  const vpRect=vp.getBoundingClientRect();
  const nodeBg=document.querySelector('.mind-node[data-id="'+node.id+'"] .node-bg');
  let screenX,screenY,screenW,screenH;
  if(nodeBg){
    const r=nodeBg.getBoundingClientRect();
    screenX=r.left-vpRect.left;
    screenY=r.top-vpRect.top;
    screenW=r.width;
    screenH=r.height;
  }else{
    screenX=node.x*zoom+panX;
    screenY=(node.y-node.height/2)*zoom+panY;
    screenW=node.width*zoom;
    screenH=node.height*zoom;
  }
  const container=document.getElementById('inline-editor');
  const ta=container.querySelector('textarea');
  container.style.display='block';
  container.style.left=screenX+'px';
  container.style.top=screenY+'px';
  ta.style.minWidth=screenW+'px';
  ta.style.minHeight=screenH+'px';
  ta.style.width=screenW+'px';
  ta.style.height=screenH+'px';
  const taFontSize=Math.round(DESC_FONT_SIZE*zoom*10)/10;
  ta.style.fontSize=taFontSize+'px';
  ta.style.lineHeight=(DESC_LINE_HEIGHT*zoom/taFontSize).toString();
  ta.style.fontWeight='normal';
  ta.style.color='#333';
  ta.style.borderLeft=(4*zoom)+'px solid '+getColor(node);
  ta.style.borderRadius=(4*zoom)+'px';
  ta.style.paddingTop=(NODE_PAD_V*zoom)+'px';
  ta.style.paddingBottom=(NODE_PAD_V*zoom)+'px';
  ta.style.paddingLeft=(6*zoom)+'px';
  ta.style.paddingRight=(6*zoom)+'px';
  ta.value=node.text;
  ta.focus();
  if(typeof cursorOffset==='number'&&cursorOffset>=0){
    const pos=Math.min(cursorOffset,node.text.length);
    ta.setSelectionRange(pos,pos);
  }else{
    ta.setSelectionRange(node.text.length,node.text.length);
  }
  autoResizeInline(ta);
}

let _measureCanvas=null;
function autoResizeInline(ta){
  const fontSize=parseFloat(ta.style.fontSize)||12;
  const lineHeight=parseFloat(ta.style.lineHeight)||1.2;
  const lineH=fontSize*lineHeight;
  const padL=parseFloat(ta.style.paddingLeft)||0;
  const padR=parseFloat(ta.style.paddingRight)||0;
  const padT=parseFloat(ta.style.paddingTop)||0;
  const padB=parseFloat(ta.style.paddingBottom)||0;
  const borderL=parseFloat(ta.style.borderLeft)||0;
  if(!_measureCanvas){_measureCanvas=document.createElement('canvas')}
  const ctx=_measureCanvas.getContext('2d');
  ctx.font=fontSize+'px Microsoft YaHei,PingFang SC,sans-serif';
  const lines=ta.value.split('\n');
  let maxW=0;
  for(const line of lines){
    const w=ctx.measureText(line||' ').width;
    if(w>maxW)maxW=w;
  }
  const newW=Math.max(parseFloat(ta.style.minWidth)||40,Math.ceil(maxW+padL+padR+borderL+4));
  const newH=Math.max(parseFloat(ta.style.minHeight)||20,Math.ceil(lines.length*lineH+padT+padB+4));
  ta.style.width=newW+'px';
  ta.style.height=newH+'px';
}

function finishInlineEdit(){
  hideNodeQuickMenu();
  const container=document.getElementById('inline-editor');
  const ta=container.querySelector('textarea');
  if(container.style.display==='block'&&inlineEditNode){
    if(!skipInlineHistory)pushHistory();
    skipInlineHistory=false;
    inlineEditNode.text=ta.value||'未命名';
    container.style.display='none';
    inlineEditNode=null;
    rebuildMap();render();
  }
}

document.getElementById('inline-editor').querySelector('textarea').addEventListener('input',function(){

});
document.getElementById('inline-editor').querySelector('textarea').addEventListener('blur',function(){

});
document.getElementById('inline-editor').querySelector('textarea').addEventListener('keydown',function(e){
  if(e.key==='Escape'){e.preventDefault();finishInlineEdit()}
  if(e.key==='Tab'){
    e.preventDefault();
    finishInlineEdit();
    addChild();
  }
  if(e.key==='Enter'&&!e.shiftKey&&e.ctrlKey){
    e.preventDefault();
    finishInlineEdit();
    addSibling();
  }
  e.stopPropagation();
});

function serializeNode(node){
  return{text:node.text,collapsed:node.collapsed,children:node.children.map(c=>serializeNode(c))};
}

function deserializeNode(data){
  const n=new MindNode(data.text);
  n.collapsed=!!data.collapsed;
  if(data.children)for(const c of data.children)n.addChild(deserializeNode(c));
  return n;
}

function exportNodeTextClean(node,indent=0){
  const nlIdx=node.text.indexOf('\n');
  let line;
  if(nlIdx>=0){
    const title=node.text.substring(0,nlIdx);
    const desc=node.text.substring(nlIdx+1).replace(/\n/g,'\\n');
    line='\t'.repeat(indent)+title+'\t'+desc;
  }else{
    line='\t'.repeat(indent)+node.text;
  }
  let result=line+'\n';
  for(const c of node.children)result+=exportNodeTextClean(c,indent+1);
  return result;
}

function copyAsStructuredText(){
  if(!selectedNode){toast('请先选择节点');return}
  const text=exportNodeTextClean(selectedNode,0).trimEnd();
  navigator.clipboard.writeText(text).then(()=>{
    toast('已复制结构文本：'+selectedNode.firstLine());
  }).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制结构文本：'+selectedNode.firstLine());
  });
}

function pasteNode(){
  if(!selectedNode){toast('请先选择目标节点');return}
  if(!clipboard){
    try{
      navigator.clipboard.readText().then(text=>{
        const data=JSON.parse(text);
        if(data.type==='mindmap-clipboard'){
          clipboard=deserializeNode(data);
          clipboardMode=data.mode==='cut'?'cut':'copy';
          doPaste();
        }else{toast('剪贴板内容不是思维导图数据')}
      }).catch(()=>{toast('剪贴板为空')});
    }catch(e){toast('剪贴板为空')}
    return;
  }
  doPaste();
}

function doPaste(){
  if(!clipboard||!selectedNode)return;
  pushHistory();
  if(clipboardMode==='cut'&&clipboardSourceNode&&clipboardSourceNode.parent){
    if(clipboardSourceNode===selectedNode||selectedNode.isDescendantOf(clipboardSourceNode)){
      toast('不能粘贴到自身或子节点');return;
    }
    clipboardSourceNode.parent.removeChild(clipboardSourceNode);
    clipboardSourceNode=null;
  }
  const pasted=cloneSubtree(clipboard);
  selectedNode.addChild(pasted);
  if(selectedNode.collapsed)selectedNode.collapsed=false;
  rebuildMap();render();selectNode(pasted);centerOnNode(pasted);
  toast('已粘贴：'+pasted.firstLine());
}

function updateClipInfo(){
  const el=document.getElementById('clipInfo');
  if(!clipboard){el.textContent='';return}
  const mode=clipboardMode==='cut'?'剪切':'复制';
  el.textContent=mode+': '+clipboard.firstLine()+' (+'+clipboard.countDescendants()+')';
}

async function handleFile(e){
  const file=e.target.files[0];if(!file)return;

    const content=ev.target.result;
    const fileName=file.name;

        activeFileName=currentFileName;
        rebuildMap();render();fitScreen();
        await uploadCurrentFile();
        toast('已更新：'+fileName+' v'+existing.version);
      }else if(choice==='newfile'){
        const baseName=fileName.replace('.txt','');

        let n=1;
        while(idx.find(x=>x.name===newName)){newName=baseName+'_导入'+(++n)+'.txt'}
        const newId=genFileId();
        saveFileData(newName,content);
        const idx2=getFileIndex();
        const f=idx2.find(x=>x.name===newName);
        if(f){f.id=newId;f.version=1;f.lastSyncVersion=0;setFileIndex(idx2)}
        currentFileName=newName;
        root=parseText(content);selectedNode=null;
        localStorage.setItem('mindmap_data',content);
        localStorage.setItem('mindmap_current_file',newName);
        lastContentHash=getContentHash();
        activeFileName=currentFileName;
        rebuildMap();render();fitScreen();
        await uploadCurrentFile();
        toast('已新建：'+newName);
      }
    }else{
      const newId=genFileId();
      saveFileData(fileName,content);
      const idx2=getFileIndex();
      const f=idx2.find(x=>x.name===fileName);
      if(f){f.id=newId;f.version=1;f.lastSyncVersion=0;setFileIndex(idx2)}
      currentFileName=fileName;
      root=parseText(content);selectedNode=null;
      localStorage.setItem('mindmap_data',content);
      localStorage.setItem('mindmap_current_file',fileName);
      lastContentHash=getContentHash();
      activeFileName=currentFileName;
      rebuildMap();render();fitScreen();
      await uploadCurrentFile();
      toast('已导入：'+fileName);
    }
  };
  reader.readAsText(file,'utf-8');e.target.value='';
}

let currentFileName='';
function getFileIndex(){
  try{return JSON.parse(localStorage.getItem('mindmap_file_index')||'[]')}catch(e){return[]}
}
function setFileIndex(idx){try{localStorage.setItem('mindmap_file_index',JSON.stringify(idx))}catch(e){}}
function saveFileData(name,data){
  const idx=getFileIndex();
  const existing=idx.find(f=>f.name===name);
  let fileId;
  if(existing){
    existing.time=Date.now();
    if(!existing.id){existing.id=genFileId()}
    if(existing.version===undefined){existing.version=0}
    if(existing.lastSyncVersion===undefined){existing.lastSyncVersion=0}
    fileId=existing.id;
  }else{
    fileId=genFileId();
    idx.push({name,time:Date.now(),id:fileId,version:0,lastSyncVersion:0})
  }
  setFileIndex(idx);
  try{localStorage.setItem('mindmap_file_id_'+fileId,JSON.stringify({data,view:{zoom,panX,panY}}))}catch(e){toast('存储空间不足')}
}
function loadFileData(name){
  try{
    const idx=getFileIndex();
    const f=idx.find(x=>x.name===name);
    if(!f||!f.id)return null;
    const raw=localStorage.getItem('mindmap_file_id_'+f.id);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}
function loadFileDataById(id){
  try{
    if(!id)return null;
    const raw=localStorage.getItem('mindmap_file_id_'+id);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}
function deleteFileDataById(id){
  if(!id)return;
  const idx=getFileIndex();
  const f=idx.find(x=>x.id===id);
  if(f)localStorage.removeItem('mindmap_file_id_'+id);
  const newIdx=idx.filter(x=>x.id!==id);
  setFileIndex(newIdx);
}
function deleteFileData(name){
  const idx=getFileIndex().filter(f=>f.name!==name);
  setFileIndex(idx);
  const f=idx.find(x=>x.name===name);
  if(f&&f.id)localStorage.removeItem('mindmap_file_id_'+f.id);
}

    const ts=d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const active=f.name===currentFileName?' active':'';

    return `<div class="file-item${active}" data-id="${fid}" data-name="${enc}">
      <span class="file-name">📄 ${f.name} <span style="font-size:10px;color:#999">v${ver} ${fid?'ID:'+fid.slice(-6):''}</span></span>
      <span class="file-time">${ts}</span>

  }).join('');
}

async function syncAllFiles(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return}
  if(syncMutex){toast('同步排队中，请稍候')}
  await enqueueSync(async()=>{
    const btn=document.getElementById('syncAllBtn');
    const status=document.getElementById('fileSyncStatus');
    btn.disabled=true;btn.textContent='⏳ 同步中...';
    status.style.display='block';status.style.color='#666';
    status.textContent='🔄 正在同步全部文件...';
  let uploaded=0,downloaded=0,deleted=0,skipped=0,errors=0;
  try{
    const cloudResult=await callCloudAPI('读取全部');
    if(cloudResult.status!=='success'||!cloudResult.数据){
      status.style.color='#e74c3c';
      status.textContent='❌ 获取云端数据失败：'+(cloudResult.tongzhi||cloudResult.message||'未知错误');
      btn.disabled=false;btn.textContent='☁️ 全部同步';
      return;
    }
    const cloudFiles=cloudResult.数据;
    const cloudIds=new Set();
    const cloudDeleteIds=new Set();
    const cloudById=new Map();
    for(const cf of cloudFiles){
      if(cf.文件名&&cf.文件名.startsWith('删除FYHFOX')){
        cloudDeleteIds.add(cf.文件名.replace('删除FYHFOX',''));
      }
      if(cf.ID&&cf.ID.trim()!==''){
        cloudIds.add(cf.ID);
        cloudById.set(cf.ID,cf);
      }
    }
    const idx=getFileIndex();
    for(const f of idx){
      if(!f.id||f.id.trim()===''){f.id=genFileId()}
      if(f.version===undefined)f.version=0;
      if(f.lastSyncVersion===undefined)f.lastSyncVersion=0;
    }
    setFileIndex(idx);
    for(const cf of cloudFiles){
      if(!cf.文件名||cf.文件名.trim()==='')continue;
      if(cf.文件名.startsWith('删除FYHFOX')){
        const delId=cf.文件名.replace('删除FYHFOX','');
        const localFile=idx.find(f=>f.id===delId);
        if(localFile){
          deleteFileData(localFile.name);
          idx.splice(idx.indexOf(localFile),1);
          deleted++;
        }
        continue;
      }
      if(!cf.ID||cf.ID.trim()==='')continue;
      const localFile=idx.find(f=>f.id===cf.ID);
      if(!localFile){
        idx.push({name:cf.文件名,time:Date.now(),id:cf.ID,version:parseInt(cf.版本号||'0'),lastSyncVersion:parseInt(cf.版本号||'0')});
        if(cf.内容){
          saveFileData(cf.文件名,cf.内容);
          if(cf.文件名===currentFileName){
            root=parseText(cf.内容);selectedNode=null;
            rebuildMap();render();
            localStorage.setItem('mindmap_data',cf.内容);
          }
        }
        downloaded++;
      }else{
        const localVer=localFile.version||0;
        const cloudVer=parseInt(cf.版本号||'0');
        if(cloudVer>localVer){
          if(!hasLocalEdits(localFile.name)){
            if(cf.内容){
              saveFileData(localFile.name,cf.内容);
              localFile.version=cloudVer;
              localFile.lastSyncVersion=cloudVer;
              if(localFile.name===currentFileName){
                root=parseText(cf.内容);selectedNode=null;
                rebuildMap();render();
                localStorage.setItem('mindmap_data',cf.内容);
              }
            }
            downloaded++;
          }else{
            const choice=await showAllSyncConflict(localFile.name,localVer,cloudVer);
            if(choice==='overwrite'&&cf.内容){
              saveFileData(localFile.name,cf.内容);
              localFile.version=cloudVer;
              localFile.lastSyncVersion=cloudVer;
              if(localFile.name===currentFileName){
                root=parseText(cf.内容);selectedNode=null;
                rebuildMap();render();
                localStorage.setItem('mindmap_data',cf.内容);
              }
              downloaded++;
            }else if(choice==='conflict'){
              const netTime=await getNetworkTime();
              const ts=new Date(netTime).toISOString().replace(/[-:T]/g,'').substring(0,14);
              const conflictName=localFile.name.replace('.txt','')+'冲突版本'+ts+'.txt';
              const conflictId=genFileId();
              const fd=loadFileData(localFile.name);
              if(fd&&fd.data){
                saveFileData(conflictName,fd.data);
                const idx2=getFileIndex();
                const f2=idx2.find(x=>x.name===conflictName);
                if(f2){f2.id=conflictId;f2.version=localVer;f2.lastSyncVersion=localVer;setFileIndex(idx2)}
                const newRow=await findFirstEmptyRow();
                await callCloudAPI('批量写入',{
                  行号:newRow,
                  数据:{ID:conflictId,文件名:conflictName,内容:fd.data,版本号:localVer.toString(),更新时间:new Date(netTime).toISOString()}
                }).catch(()=>{});
              }
              saveFileData(localFile.name,cf.内容);
              localFile.version=cloudVer;
              localFile.lastSyncVersion=cloudVer;
              if(localFile.name===currentFileName){
                root=parseText(cf.内容);selectedNode=null;
                rebuildMap();render();
                localStorage.setItem('mindmap_data',cf.内容);
              }
              downloaded++;
            }else{skipped++}
          }
        }
      }
    }
    for(let i=idx.length-1;i>=0;i--){
      const f=idx[i];
      if(cloudIds.has(f.id))continue;
      if(cloudDeleteIds.has(f.id)){
        deleteFileData(f.name);
        idx.splice(i,1);
        deleted++;
      }
    }
    setFileIndex(idx);
    for(const f of idx){
      try{
        if(cloudDeleteIds.has(f.id))continue;
        const fd=loadFileData(f.name);
        if(!fd||!fd.data)continue;
        const cloudLookup=await findFileInCloudById(f.id);
        if(!cloudLookup.networkOk){errors++;continue}
        if(!cloudLookup.file){
          const netTime=await getNetworkTime();
          const newRow=await findFirstEmptyRow();
          const wr=await callCloudAPI('批量写入',{
            行号:newRow,
            数据:{ID:f.id,文件名:f.name,内容:fd.data,版本号:(f.version||0).toString(),更新时间:new Date(netTime).toISOString()}
          });
          if(wr.status==='success'){
            setLastSyncVersion(f.name,f.version||0);
            uploaded++;
          }else{errors++}
        }else{
          const cloudFile=cloudLookup.file;
          const cloudVer=parseInt(cloudFile.版本号||'0');
          if((f.version||0)>cloudVer){
            const netTime=await getNetworkTime();
            const wr=await callCloudAPI('批量写入',{
              行号:cloudFile._行号,
              数据:{ID:f.id,文件名:f.name,内容:fd.data,版本号:(f.version||0).toString(),更新时间:new Date(netTime).toISOString()}
            });
            if(wr.status==='success'){
              setLastSyncVersion(f.name,f.version||0);
              uploaded++;
            }else{errors++}
          }
        }
      }catch(e){errors++}
    }
    for(const delId of cloudDeleteIds){
      try{
        const lookup=await callCloudAPI('查找',{列名:'文件名',关键字:'删除FYHFOX'+delId});
        if(lookup.status==='success'&&lookup.匹配数>0&&lookup.数据[0]._行号){
          const netTime=await getNetworkTime();
          await callCloudAPI('批量写入',{
            行号:lookup.数据[0]._行号,
            数据:{ID:'',文件名:'',内容:'',版本号:'0',更新时间:new Date(netTime).toISOString()}
          });
        }
      }catch(e){}
    }
    for(const cf of cloudFiles){
      if(cf.文件名&&cf.文件名.startsWith('删除FYHFOX'))continue;
      if(!cf.ID||cf.ID.trim()===''){
        if(!cf.文件名||cf.文件名.trim()==='')continue;
        const localByName=idx.find(f=>f.name===cf.文件名);
        if(!localByName){
          try{
            const lookup=await callCloudAPI('查找',{列名:'文件名',关键字:cf.文件名});
            if(lookup.status==='success'&&lookup.匹配数>0&&lookup.数据[0]._行号){
              const netTime=await getNetworkTime();
              callCloudAPI('批量写入',{
                行号:lookup.数据[0]._行号,
                数据:{ID:'',文件名:'',内容:'',版本号:'0',更新时间:new Date(netTime).toISOString()}
              }).catch(()=>{});
            }
          }catch(e){}
        }
      }
    }
  }catch(e){errors++}
  renderFileList();
  status.style.color=errors?'#e67e22':'#27ae60';
  let msg='✅ 同步完成 | 上传: '+uploaded+' | 下载: '+downloaded+' | 远程删除: '+deleted;
  if(skipped)msg+=' | 有编辑跳过: '+skipped;
  if(errors)msg+=' | 错误: '+errors;
  status.textContent=msg;
  btn.disabled=false;btn.textContent='☁️ 全部同步';
  setLastSyncTime(Date.now());
  },'全部同步');
}

function findNodeAt(px,py){
  for(const id in nodeMap){
    const n=nodeMap[id];
    if(px>=n.x&&px<=n.x+n.width&&py>=n.y-n.height/2&&py<=n.y+n.height/2)return n;
  }
  return null;
}

function renderDragGhost(node,container){
  function drawOne(n){
    const g=document.createElementNS(SVG_NS,'g');
    g.setAttribute('class','drag-ghost');
    const rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('x',n.x);rect.setAttribute('y',n.y-n.height/2);
    rect.setAttribute('width',n.width);rect.setAttribute('height',n.height);
    rect.setAttribute('rx','6');rect.setAttribute('fill','#fff');
    rect.setAttribute('stroke',getColor(n));rect.setAttribute('stroke-width','2');
    rect.setAttribute('opacity','0.5');
    g.appendChild(rect);
    const bar=document.createElementNS(SVG_NS,'rect');
    bar.setAttribute('x',n.x);bar.setAttribute('y',n.y-n.height/2);
    bar.setAttribute('width','4');bar.setAttribute('height',n.height);
    bar.setAttribute('rx','2');bar.setAttribute('fill',getColor(n));bar.setAttribute('opacity','0.5');
    g.appendChild(bar);
    renderNodeContent(n,g,0,0,0.5);
    container.appendChild(g);
    if(!n.collapsed)for(const c of n.children)drawOne(c);
  }
  drawOne(node);
}

function showNodeQuickMenu(node){
  hideNodeQuickMenu();
  const menu=document.getElementById('node-quick-menu');
  const vp=document.getElementById('viewport');
  const vpRect=vp.getBoundingClientRect();
  const nodeBg=document.querySelector('.mind-node[data-id="'+node.id+'"] .node-bg');
  let screenX,screenY,screenW;
  if(nodeBg){
    const r=nodeBg.getBoundingClientRect();
    screenX=r.left-vpRect.left;
    screenY=r.top-vpRect.top;
    screenW=r.width;
  }else{
    screenX=node.x*zoom+panX;
    screenY=(node.y-node.height/2)*zoom+panY;
    screenW=node.width*zoom;
  }
  menu.style.display='flex';
  const menuW=menu.offsetWidth;
  let left=screenX+screenW/2-menuW/2;
  if(left<2)left=2;
  if(left+menuW>vpRect.width-2)left=vpRect.width-menuW-2;
  let top=screenY-menu.offsetHeight-2;
  if(top<2)top=screenY+node.height*zoom+2;
  menu.style.left=left+'px';
  menu.style.top=top+'px';
}

document.addEventListener('keydown',function(e){
  if(document.getElementById('edit-modal').classList.contains('show')||
     document.getElementById('import-modal').classList.contains('show'))return;
  if(document.getElementById('inline-editor').style.display==='block')return;
  const ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&e.key==='z'){e.preventDefault();undo();return}
  if(ctrl&&e.key==='y'){e.preventDefault();redo();return}
  if(ctrl&&e.key==='x'){e.preventDefault();cutNode();return}
  if(ctrl&&e.key==='c'){e.preventDefault();copyNode();copyAsStructuredText();return}
  if(ctrl&&e.key==='v'){e.preventDefault();pasteNode();return}
  if(e.key==='Delete'||e.key==='Backspace'){if(selectedNode)deleteNode()}
  else if(e.key==='Tab'){e.preventDefault();addChild()}
  else if(e.key==='Enter'){e.preventDefault();addSibling()}
  else if(e.key==='F2'){e.preventDefault();editNode()}
  else if(e.key===' '){e.preventDefault();toggleCollapse()}
  else if(e.key==='='||e.key==='+'){e.preventDefault();zoomIn()}
  else if(e.key==='-'){e.preventDefault();zoomOut()}
  else if(e.key==='0'){e.preventDefault();fitScreen()}
  else if(e.key==='F11'){e.preventDefault();toggleFullscreen()}
  else if(e.key==='ArrowRight'&&selectedNode){
    if(selectedNode.children.length>0&&!selectedNode.collapsed)selectNode(selectedNode.children[0]);
  }else if(e.key==='ArrowLeft'&&selectedNode&&selectedNode.parent){
    selectNode(selectedNode.parent);
  }else if(e.key==='ArrowDown'&&selectedNode&&selectedNode.parent){
    const siblings=selectedNode.parent.children;
    const idx=siblings.indexOf(selectedNode);
    if(idx<siblings.length-1)selectNode(siblings[idx+1]);
  }else if(e.key==='ArrowUp'&&selectedNode&&selectedNode.parent){
    const siblings=selectedNode.parent.children;
    const idx=siblings.indexOf(selectedNode);
    if(idx>0)selectNode(siblings[idx-1]);
  }
});

const SAMPLE_TEXT=`思维导图
\t主题一
\t\t子项A
\t\t子项B
\t\t\t细节1
\t\t\t细节2
\t主题二
\t\t子项C
\t\t子项D`;

(function init(){
  let isFirstLoad=false;
  try{
    currentFileName=localStorage.getItem('mindmap_current_file')||'';
    const saved=localStorage.getItem('mindmap_data');
    if(saved){
      root=parseText(saved);
    }else{
      root=parseText(SAMPLE_TEXT);
      isFirstLoad=true;
    }
    const viewStr=localStorage.getItem('mindmap_view');
    if(viewStr){
      const v=JSON.parse(viewStr);
      zoom=v.zoom||1;panX=v.panX||0;panY=v.panY||0;
    }
  }catch(e){
    root=parseText(SAMPLE_TEXT);
    isFirstLoad=true;
  }
  if(isFirstLoad&&root){
    (function collapseBelow(n,d){
      if(d>=3&&n.children.length>0)n.collapsed=true;
      for(const c of n.children)collapseBelow(c,d+1);
    })(root,0);
  }
  rebuildMap();
  function clearOldBranchColors(n){
    if(!n._userColor)n._branchColor=null;
    for(const c of n.children)clearOldBranchColors(c);
  }
  function rebuildUsedColors(n){
    if(n._branchColor)usedBranchColors.add(n._branchColor);
    for(const c of n.children)rebuildUsedColors(c);
  }
  function assignBranchColors(n,parentColor){
    const lvl=getLevel(n);
    if(lvl===0){
      for(const c of n.children)assignBranchColors(c,null);
    }else if(lvl===1){
      if(!n._branchColor){
        n._branchColor=pickBranchColor(null);
        usedBranchColors.add(n._branchColor);
      }
      for(const c of n.children)assignBranchColors(c,n._branchColor);
    }else if(lvl>=2){
      if(!n._branchColor){
        n._branchColor=parentColor||pickBranchColor(null);
        usedBranchColors.add(n._branchColor);
      }
      for(const c of n.children)assignBranchColors(c,n._branchColor);
    }
  }
  function checkBranchColors(){
    const l1nodes=[];
    (function walk(n){if(getLevel(n)===1)l1nodes.push(n);for(const c of n.children)walk(c)})(root);
    const colorMap=new Map();
    for(const n of l1nodes){
      if(!colorMap.has(n._branchColor))colorMap.set(n._branchColor,[]);
      colorMap.get(n._branchColor).push(n);
    }
    if(usedBranchColors.size<MAX_USED_COLORS){
      for(const [color,nodes] of colorMap){
        if(nodes.length>1){
          for(let i=1;i<nodes.length;i++){
            const avoid=color;
            nodes[i]._branchColor=pickBranchColor(avoid);
            usedBranchColors.add(nodes[i]._branchColor);
          }
        }
      }
    }
  }
  if(root)clearOldBranchColors(root);
  usedBranchColors=new Set();
  if(root)assignBranchColors(root,null);
  if(root)checkBranchColors();
  render();
  if(panX===0&&panY===0&&zoom===1)setTimeout(fitScreen,100);
  
  // 初始化云同步
  lastContentHash = getContentHash();
  activeFileName = currentFileName;
  
  (async function() {
    try {
      await initSyncSheet();
    } catch (e) {}
    startSyncTimers();
  })();
  
  window.addEventListener('message', function(e){
    const data = e.data;
    if(!data || !data.type) return;
    
    if(data.type === 'fileDeleted'){
      if(currentFileName === data.name){
        currentFileName = '';
        localStorage.removeItem('mindmap_current_file');
        root = parseText(SAMPLE_TEXT);
        selectedNode = null;
        lastContentHash = getContentHash();
        rebuildMap();
        render();
        setTimeout(fitScreen, 100);
        toast('已打开默认页');
      }
    }
    
    if(data.type === 'fileRenamed'){
      // 重命名的是当前打开的文件，更新引用
      if(currentFileName === data.oldName){
        currentFileName = data.newName;
        localStorage.setItem('mindmap_current_file', data.newName);
      }
    }
    
    if(data.type === 'openFile'){
      openNamedFile(data.name);
    }
    
    if(data.type === 'fileSaved'){
      // 文件管理页面保存了新文件
      renderFileList();
    }
    
    if(data.type === 'syncComplete'){
      // 一键同步完成
      toast(`同步完成 | 拉取:${data.pulled} 上传:${data.uploaded}`);
    }
  });
})();
</script>
</body>
</html>
