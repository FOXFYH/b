<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文件管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-radius:6px;margin-bottom:3px;background:#f8f9fa;cursor:pointer;transition:background .15s;font-size:12px}
.file-item:hover{background:#e8f0fe}
.file-item .file-name{color:#333;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .file-time{font-size:10px;color:#999;margin-left:6px;white-space:nowrap}
.file-item .file-del{font-size:11px;color:#e74c3c;cursor:pointer;margin-left:6px;padding:1px 4px;border-radius:3px}
.file-item .file-del:hover{background:#fef0ef}
.file-item.active{background:#e8f0fe;border:1px solid #4A90D9}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 2px}
.header h3{margin:0;font-size:14px}
.header-right{display:flex;align-items:center;gap:6px;font-size:11px;color:#888}
.btn-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.btn-row input{flex:1;min-width:100px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px}
.btn-row button,.btn-row2 button{padding:4px 10px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-size:11px;font-family:inherit;white-space:nowrap;transition:all .15s}
.btn-row button:hover,.btn-row2 button:hover{background:#e8f0fe;border-color:#4A90D9}
.btn-row button.primary,.btn-row2 button.primary{background:#4A90D9;color:#fff;border-color:#4A90D9}
.btn-row2{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.btn-row2 .spacer{flex:1}
#fileList{flex:1;overflow-y:auto;min-height:60px}
#fileSyncStatus{font-size:10px;color:#666;margin-top:4px;padding:3px 6px;background:#fafafa;border-radius:3px;display:none}
.folder-item{display:flex;align-items:center;padding:6px 12px;border-radius:6px;margin-bottom:3px;background:#fffde7;cursor:pointer;transition:background .15s;font-size:12px;border:1px solid #f0e68c}
.folder-item:hover{background:#fff9c4}
.folder-item .folder-name{flex:1;color:#333}
.folder-item .folder-count{font-size:10px;color:#999}
</style>
</head>
<body>
<div class="header">
  <h3>📁 文件管理</h3>
  <div class="header-right">
    <span>路径:</span>
    <span id="folderPath" style="font-weight:bold;color:#b8860b">/</span>
    <button onclick="showSyncSettings()" style="margin-left:6px;padding:2px 8px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:10px">设置</button>
    <button onclick="closeSelf()" title="关闭" style="margin-left:4px;padding:2px 6px;border:none;border-radius:4px;background:#fff;cursor:pointer;font-size:14px;color:#999;transition:all .2s" onmouseover="this.style.background='#f5f5f5';this.style.color='#e74c3c'" onmouseout="this.style.background='#fff';this.style.color='#999'">✕</button>
  </div>
</div>
<div class="btn-row">
  <input id="fileNameInput" type="text" placeholder="输入文件名">
  <button class="primary" onclick="saveNamedFile()">保存</button>
  <button onclick="showRenameDialog()">改名</button>
  <button onclick="copyCurrentFile()">复制</button>
  <button onclick="importFile()">导入</button>
  <button onclick="exportText()">导出</button>
</div>
<div class="btn-row2">
  <button onclick="syncCurrentFile()" id="syncCurBtn" style="background:#4A90D9;color:#fff;border-color:#3a7bd5">同步当前</button>
  <button onclick="syncAllFiles()" id="syncAllBtn">全部同步</button>
  <button onclick="refreshCloudList()" id="refreshCloudBtn">刷新云端</button>
  <button onclick="createFolder()" style="background:#f0c040;border-color:#d4a017;color:#333">新建文件夹</button>
  <button onclick="showMoveFileDialog()">移动到</button>
  <button onclick="deleteSelectedFile()">删除</button>
  <span class="spacer"></span>
  <button onclick="closeSelf()">关闭</button>
</div>
<div id="fileList"></div>
<div id="fileSyncStatus"></div>

<div id="sync-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:center">
  <div style="background:#fff;border-radius:10px;padding:16px;width:380px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.2)">
    <h3 style="font-size:14px;margin-bottom:8px">同步设置</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 10px">
      <div style="grid-column:1/-1"><label style="font-size:11px">云函数地址</label><input id="syncApiUrl" type="text" placeholder="https://..." style="width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;margin-top:2px"></div>
      <div style="grid-column:1/-1"><label style="font-size:11px">Webhook 地址</label><input id="syncWebhookUrl" type="text" placeholder="https://www.kdocs.cn/..." style="width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;margin-top:2px"></div>
      <div style="grid-column:1/-1"><label style="font-size:11px">AirScript Token</label><input id="syncToken" type="text" placeholder="可选" style="width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;margin-top:2px"></div>
      <div><label style="font-size:11px">保存间隔(秒)</label><input id="syncAutoSaveInterval" type="number" value="5" min="1" max="60" style="width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;margin-top:2px"></div>
      <div><label style="font-size:11px">检查间隔(分)</label><input id="syncCloudCheckInterval" type="number" value="5" min="1" max="60" style="width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;margin-top:2px"></div>
      <div><label style="font-size:11px">同步差值</label><input id="syncThreshold" type="number" value="5" min="1" max="20" style="width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;margin-top:2px"></div>
      <div><label style="font-size:11px">重试次数</label><input id="syncRetryCount" type="number" value="5" min="1" max="10" style="width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;margin-top:2px"></div>
      <div><label style="font-size:11px">重试间隔(秒)</label><input id="syncRetryInterval" type="number" value="2" min="1" max="10" style="width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;margin-top:2px"></div>
      <div style="display:flex;align-items:center;gap:4px;grid-column:1/-1;margin-top:2px"><input id="syncEnabled" type="checkbox" checked><label for="syncEnabled" style="margin:0;font-size:11px">启用云同步</label></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:10px">
      <button onclick="closeSyncSettings()" style="padding:4px 14px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-size:11px">取消</button>
      <button onclick="saveSyncSettings()" style="padding:4px 14px;border:none;border-radius:4px;background:#4A90D9;color:#fff;cursor:pointer;font-size:11px">保存</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".txt" style="display:none" onchange="handleFileImport(event)">

<script>
const SYNC_CONFIG_KEY='mindmap_sync_config';
const PRIMARY_API_URLS=['https://1408347752-dxgsap4qrj.ap-guangzhou.tencentscf.com'];
const FALLBACK_API_URLS=[];
const DEFAULT_SYNC_CONFIG={enabled:true,apiUrl:PRIMARY_API_URLS[0],webhookUrl:'https://www.kdocs.cn/api/v3/ide/file/ctRsEvOpYZky/script/V2-1cf9aRSXUlNao8Qhjk4ATb/sync_task',token:'',autoSaveInterval:5,cloudCheckInterval:5,syncThreshold:5,sheetName:'自用脑图',retryCount:5,retryInterval:2};

let cloudFileCache=new Map();
let currentFolder='';
let currentFileName='';
let currentFileContent='';
let syncMutex=false;
let syncQueue=[];
let lastSyncTime=0;
let serverTimeOffset=0;

function genFileId(){return Math.floor(1000000000+Math.random()*9000000000).toString()}
function getSyncConfig(){try{return JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY))||{...DEFAULT_SYNC_CONFIG}}catch(e){return{...DEFAULT_SYNC_CONFIG}}}
function saveSyncConfigToLS(c){try{localStorage.setItem(SYNC_CONFIG_KEY,JSON.stringify(c))}catch(e){}}
function getFileIndex(){try{return JSON.parse(localStorage.getItem('mindmap_file_index')||'[]')}catch(e){return[]}}
function setFileIndex(idx){try{localStorage.setItem('mindmap_file_index',JSON.stringify(idx))}catch(e){}}
function getFileMeta(name){const idx=getFileIndex();return idx.find(f=>f.name===name)||null}
function getFileVersion(name){const m=getFileMeta(name);return m?m.version||0:0}
function setFileVersion(name,ver){const idx=getFileIndex();const f=idx.find(x=>x.name===name);if(f){f.version=ver;setFileIndex(idx)}}
function getLastSyncVersion(name){const m=getFileMeta(name);return m?m.lastSyncVersion||0:0}
function setLastSyncVersion(name,ver){const idx=getFileIndex();const f=idx.find(x=>x.name===name);if(f){f.lastSyncVersion=ver;setFileIndex(idx)}}
function clearNewFileFlag(id){const idx=getFileIndex();const f=idx.find(x=>x.id===id);if(f){delete f.isNewFile;setFileIndex(idx)}}
function setNewFileFlag(id){const idx=getFileIndex();const f=idx.find(x=>x.id===id);if(f){f.isNewFile=true;setFileIndex(idx)}}
function isNewFileById(id){const idx=getFileIndex();const f=idx.find(x=>x.id===id);return!!(f&&f.isNewFile)}
function hasLocalEdits(name){const m=getFileMeta(name);if(!m)return false;return(m.version||0)>(m.lastSyncVersion||0)}
function getLastSyncTime(){try{return parseInt(localStorage.getItem('mindmap_last_sync_time')||'0')}catch(e){return 0}}
function setLastSyncTime(t){try{localStorage.setItem('mindmap_last_sync_time',t.toString())}catch(e){}}

function saveFileData(name,data){
  const idx=getFileIndex();
  const existing=idx.find(f=>f.name===name);
  let fileId;
  if(existing){
    existing.time=Date.now();
    if(!existing.id){existing.id=genFileId();existing.isNewFile=true}
    if(existing.version===undefined)existing.version=0;
    if(existing.lastSyncVersion===undefined)existing.lastSyncVersion=0;
    fileId=existing.id;
  }else{
    fileId=genFileId();
    idx.push({name,time:Date.now(),id:fileId,version:0,lastSyncVersion:0,isNewFile:true,folder:currentFolder||''});
  }
  setFileIndex(idx);
  try{localStorage.setItem('mindmap_file_id_'+fileId,JSON.stringify({data}))}catch(e){toast('存储空间不足')}
  return fileId;
}

function loadFileData(name){
  try{
    const idx=getFileIndex();const f=idx.find(x=>x.name===name);
    if(!f||!f.id)return null;
    const raw=localStorage.getItem('mindmap_file_id_'+f.id);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}

function loadFileDataById(id){
  try{
    const raw=localStorage.getItem('mindmap_file_id_'+id);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}

function deleteFileDataById(id){
  const idx=getFileIndex();
  const i=idx.findIndex(x=>x.id===id);
  if(i!==-1){
    localStorage.removeItem('mindmap_file_id_'+id);
    idx.splice(i,1);
    setFileIndex(idx);
  }
}

function deleteFileData(name){
  const idx=getFileIndex();
  const f=idx.find(x=>x.name===name);
  if(f){
    localStorage.removeItem('mindmap_file_id_'+f.id);
    idx.splice(idx.indexOf(f),1);
    setFileIndex(idx);
  }
}

function syncLocalFileName(localFile,cloudFileName){
  if(!cloudFileName||cloudFileName===localFile.name)return false;
  const oldName=localFile.name;
  const fd=loadFileData(oldName);
  if(fd){
    deleteFileData(oldName);
    localFile.name=cloudFileName;
    saveFileData(cloudFileName,fd.data);
    return true;
  }
  return false;
}

function _applyServerDate(dateStr){try{serverTimeOffset=new Date(dateStr).getTime()-Date.now()}catch(e){}}
async function getNetworkTime(){return Date.now()+serverTimeOffset}

async function callCloudAPI(action,params={}){
  const config=getSyncConfig();
  if(!config.enabled)return{status:'error',message:'云同步未启用',isNetworkError:false};
  const payload={webhookUrl:config.webhookUrl,message:{Context:{argv:{表格名:config.sheetName,操作:action,...params}}}};
  const headers={'Content-Type':'application/json'};
  if(config.token)headers['AirScript-Token']=config.token;
  const allUrls=[...PRIMARY_API_URLS,...FALLBACK_API_URLS];
  const maxRetries=config.retryCount||5;
  const retryInterval=config.retryInterval||2;
  for(const apiUrl of allUrls){
    let lastError=null;let lastIsNetworkError=true;
    for(let attempt=0;attempt<maxRetries;attempt++){
      try{
        const response=await fetch(apiUrl,{method:'POST',headers,body:JSON.stringify(payload)});
        if(!response.ok)throw new Error('HTTP '+response.status);
        const dateHeader=response.headers.get('Date');
        if(dateHeader)_applyServerDate(dateHeader);
        const result=await response.json();
        const r=result.data?.result||result;
        if(r.status==='success')return r;
        if(r.tongzhi){
          const netKeywords=['网络','超时','timeout','ECONNRESET','ENOTFOUND','fetch','Failed to fetch','NetworkError','Network request'];
          const isNet=netKeywords.some(k=>r.tongzhi.includes(k));
          if(!isNet)return{...r,isNetworkError:false};
          lastError=new Error(r.tongzhi);lastIsNetworkError=true;
        }else{
          lastError=new Error(r.message||JSON.stringify(r).slice(0,100)||'未知错误');lastIsNetworkError=true;
        }
      }catch(error){lastError=error;lastIsNetworkError=true}
      if(attempt<maxRetries-1)await new Promise(r=>setTimeout(r,retryInterval*1000));
    }
  }
  return{status:'error',message:lastError?.message||'所有云函数地址均不可用',isNetworkError:lastIsNetworkError};
}

async function findFirstEmptyRow(){
  const result=await callCloudAPI('获取维度');
  if(result.status==='success'&&result.最大行)return result.最大行+1;
  return 2;
}

async function findFileInCloudById(fileId){
  if(!fileId)return{file:null,networkOk:false};
  const result=await callCloudAPI('查找',{列名:'ID',关键字:fileId});
  if(result.status==='success'){
    if(result.匹配数>0)return{file:result.数据[0],networkOk:true};
    return{file:null,networkOk:true};
  }
  return{file:null,networkOk:false};
}

async function findFileInCloud(fileName){
  const result=await callCloudAPI('查找',{列名:'文件名',关键字:fileName});
  if(result.status==='success'){
    if(result.匹配数>0)return{file:result.数据[0],networkOk:true};
    return{file:null,networkOk:true};
  }
  return{file:null,networkOk:false};
}

function enqueueSync(fn,label){
  return new Promise((resolve,reject)=>{
    const existing=syncQueue.findIndex(t=>t.label===label);
    if(existing!==-1){const old=syncQueue[existing];old.fn=fn;old.resolve=resolve;old.reject=reject}
    else syncQueue.push({fn,label,resolve,reject});
    processSyncQueue();
  });
}

function processSyncQueue(){
  if(syncMutex||syncQueue.length===0)return;
  syncMutex=true;
  const task=syncQueue.shift();
  task.fn().then(r=>{syncMutex=false;task.resolve(r);processSyncQueue()}).catch(e=>{syncMutex=false;task.reject(e);processSyncQueue()});
}

function getSubFolders(parentFolder){
  const idx=getFileIndex();
  const subFolders=new Set();
  const prefix=parentFolder?parentFolder+'/':'';
  for(const f of idx){
    const fd=f.folder||'';
    if(!fd)continue;
    if(parentFolder){
      if(fd.startsWith(prefix)){const rest=fd.slice(prefix.length);if(rest&&!rest.includes('/'))subFolders.add(rest)}
    }else{
      if(!fd.includes('/'))subFolders.add(fd);
    }
  }
  for(const[id,cf]of cloudFileCache){
    const fd=cf.文件夹路径||'';
    if(!fd)continue;
    if(parentFolder){
      if(fd.startsWith(prefix)){const rest=fd.slice(prefix.length);if(rest&&!rest.includes('/'))subFolders.add(rest)}
    }else{
      if(!fd.includes('/'))subFolders.add(fd);
    }
  }
  return Array.from(subFolders).sort();
}

function getFilesInFolder(folder){
  const idx=getFileIndex();
  const prefix=folder?folder+'/':'';
  return idx.filter(f=>{
    const fd=f.folder||'';
    if(!folder)return!fd;
    return fd===folder||fd.startsWith(prefix);
  }).sort((a,b)=>b.time-a.time||a.name.localeCompare(b.name));
}

function getFileSyncStatus(localFile){
  if(!cloudFileCache.size)return{label:'未连接',color:'#999',icon:''};
  if(localFile.isNewFile)return{label:'待上传',color:'#e67e22',icon:''};
  const cloud=cloudFileCache.get(localFile.id);
  if(!cloud)return{label:'仅本地',color:'#e67e22',icon:''};
  const cloudVer=parseInt(cloud.版本号||'0');
  const localVer=localFile.version||0;
  if(localVer>cloudVer)return{label:'待上传',color:'#e67e22',icon:''};
  if(localVer===cloudVer)return{label:'已同步',color:'#27ae60',icon:''};
  return{label:'待下载',color:'#3498db',icon:''};
}

function renderFileList(){
  const list=document.getElementById('fileList');
  const idx=getFileIndex();
  if(idx.length===0&&cloudFileCache.size===0){list.innerHTML='<div style="text-align:center;color:#999;padding:20px 0">暂无保存的文件</div>';return}
  const subFolders=getSubFolders(currentFolder);
  let html='';
  if(currentFolder){
    const parentFolder=currentFolder.includes('/')?currentFolder.slice(0,currentFolder.lastIndexOf('/')):'';
    html+=`<div class="folder-item" onclick="navigateFolder('${encodeURIComponent(parentFolder)}')"><span class="folder-name">⬆ 返回上级</span></div>`;
  }
  for(const sub of subFolders){
    const fullPath=currentFolder?currentFolder+'/'+sub:sub;
    const count=getFilesInFolder(fullPath).length;
    html+=`<div class="folder-item" ondblclick="navigateFolder('${encodeURIComponent(fullPath)}')" oncontextmenu="event.preventDefault();deleteFolder('${sub.replace(/'/g,"\\'")}')"><span class="folder-name">📁 ${sub}</span><span class="folder-count">${count}个文件</span></div>`;
  }
  const displayFiles=idx.filter(f=>(f.folder||'')===currentFolder);
  for(const f of displayFiles){
    const status=getFileSyncStatus(f);
    const statusHtml=cloudFileCache.size>0?`<span style="font-size:9px;color:${status.color}" title="${status.label}">${status.icon} ${status.label}</span> `:'';
    const folderInfo=(!currentFolder&&f.folder)?`<span style="font-size:9px;color:#b8860b">📁${f.folder}</span> `:'';
    html+=`<div class="file-item" data-id="${f.id}" data-name="${encodeURIComponent(f.name)}">${statusHtml}${folderInfo}<span class="file-name">${f.name}</span><span class="file-time">${f.time?new Date(f.time).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</span><span class="file-del" data-del="${encodeURIComponent(f.name)}">✕</span></div>`;
  }
  if(cloudFileCache.size>0){
    const cloudOnly=[];
    for(const[cid,cf]of cloudFileCache){
      const cfFolder=cf.文件夹路径||'';
      if(cfFolder===currentFolder&&!idx.find(f=>f.id===cid)){
        cloudOnly.push({id:cid,name:cf.文件名||'(无名)',ver:cf.版本号||'0'});
      }
    }
    if(cloudOnly.length>0){
      html+='<div style="padding:3px 10px;font-size:10px;color:#999;border-top:1px solid #eee;margin-top:2px">☁️ 以下仅存于云端</div>';
      for(const cf of cloudOnly){
        html+=`<div class="file-item" data-id="${cf.id}" data-name="${encodeURIComponent(cf.name)}" style="opacity:0.7"><span class="file-name">☁️ ${cf.name} <span style="font-size:9px;color:#999">v${cf.ver}</span> <span style="font-size:9px;color:#9b59b6">仅存于云端</span></span></div>`;
      }
    }
  }
  list.innerHTML=html;
}

document.getElementById('fileList').addEventListener('click',function(e){
  const delBtn=e.target.closest('[data-del]');
  if(delBtn){
    e.stopPropagation();
    const name=decodeURIComponent(delBtn.getAttribute('data-del'));
    deleteNamedFile(name);
    return;
  }
  const item=e.target.closest('.file-item');
  if(!item)return;
  document.querySelectorAll('.file-item.active').forEach(el=>el.classList.remove('active'));
  item.classList.add('active');
  const name=decodeURIComponent(item.getAttribute('data-name'));
  document.getElementById('fileNameInput').value=name.replace('.txt','');
  const id=item.getAttribute('data-id');
  const fd=loadFileDataById(id);
  if(fd){
    currentFileName=name;
    currentFileContent=fd.data||'';
    notifyParent('fileSelected',{name,content:fd.data||'',id});
  }
});

document.getElementById('fileList').addEventListener('dblclick',function(e){
  const item=e.target.closest('.file-item');
  if(!item)return;
  const id=item.getAttribute('data-id');
  const name=decodeURIComponent(item.getAttribute('data-name'));
  const fd=loadFileDataById(id);
  if(fd){
    currentFileName=name;
    currentFileContent=fd.data||'';
    notifyParent('openFile',{name,content:fd.data,id});
  }
});

function navigateFolder(folder){
  currentFolder=folder?decodeURIComponent(folder):'';
  updateFolderPath();
  renderFileList();
}

function updateFolderPath(){
  const pathEl=document.getElementById('folderPath');
  if(!currentFolder){pathEl.innerHTML='<span style="cursor:pointer" onclick="navigateFolder(\'\')">/</span>';return}
  let html='<span style="cursor:pointer" onclick="navigateFolder(\'\')">/</span>';
  const parts=currentFolder.split('/');
  for(let i=0;i<parts.length;i++){
    const path=parts.slice(0,i+1).join('/');
    const isLast=i===parts.length-1;
    html+=`<span style="cursor:pointer;${isLast?'font-weight:bold':''}" onclick="navigateFolder('${encodeURIComponent(path)}')">${parts[i]}</span>`;
    if(!isLast)html+='<span style="color:#ccc">/</span>';
  }
  pathEl.innerHTML=html;
}

async function createFolder(){
  const name=prompt('输入文件夹名称：');
  if(!name||!name.trim())return;
  const subName=name.trim();
  const fullFolderName=currentFolder?currentFolder+'/'+subName:subName;
  const subFolders=getSubFolders(currentFolder);
  if(subFolders.includes(subName)){toast('文件夹已存在');return}
  const idx=getFileIndex();
  const fileId=genFileId();
  idx.push({name:'.folder_'+fullFolderName,time:Date.now(),id:fileId,version:0,lastSyncVersion:0,isNewFile:true,folder:currentFolder||''});
  setFileIndex(idx);
  const config=getSyncConfig();
  if(config.enabled){
    const netTime=await getNetworkTime();
    const newRow=await findFirstEmptyRow();
    await callCloudAPI('批量写入',{行号:newRow,数据:{ID:fileId,文件名:'.folder',内容:'',版本号:'0',文件夹路径:fullFolderName,最后上传发起时间:new Date(netTime).toISOString()}});
    clearNewFileFlag(fileId);
  }
  toast('已创建文件夹：'+subName);
  renderFileList();
}

async function deleteFolder(folderName){
  if(!confirm('确定删除文件夹"'+folderName+'"及其所有子文件夹和文件？'))return;
  const config=getSyncConfig();
  const idx=getFileIndex();
  const filesInFolder=idx.filter(f=>{
    const fd=f.folder||'';
    return fd===folderName||fd.startsWith(folderName+'/');
  });
  if(config.enabled){
    toast('正在删除云端文件夹...');
    const cloudResult=await callCloudAPI('读取全部');
    if(cloudResult.status==='success'&&cloudResult.数据){
      const rowsToDelete=cloudResult.数据.filter(cf=>{
        const fd=cf.文件夹路径||'';
        return fd===folderName||fd.startsWith(folderName+'/');
      });
      for(const row of rowsToDelete){
        const rowId=row.ID||'';
        if(!rowId.trim())continue;
        const lookup=await callCloudAPI('查找',{列名:'ID',关键字:rowId});
        if(lookup.status==='success'&&lookup.匹配数>0&&lookup.数据[0]._行号){
          await callCloudAPI('批量写入',{行号:lookup.数据[0]._行号,数据:{ID:'',文件名:'',内容:'',版本号:'',文件夹路径:'',同步时间:'',最后上传发起时间:'',最后编辑时间:''}});
        }
      }
    }
  }
  for(const f of filesInFolder){
    if(f.id)localStorage.removeItem('mindmap_file_id_'+f.id);
  }
  const newIdx=idx.filter(f=>{
    const fd=f.folder||'';
    return fd!==folderName&&!fd.startsWith(folderName+'/');
  });
  setFileIndex(newIdx);
  if(currentFolder===folderName||currentFolder.startsWith(folderName+'/'))currentFolder='';
  toast('文件夹已删除：'+folderName);
  if(config.enabled)await refreshCloudList();
  renderFileList();
}

  const cloudResult=await callCloudAPI('读取全部');
  cloudFileCache.clear();
  if(cloudResult.status==='success'&&cloudResult.数据){
    for(const cf of cloudResult.数据){
      if(cf.ID&&cf.ID.trim()){
        cloudFileCache.set(cf.ID,{文件名:cf.文件名||'',版本号:cf.版本号||'0',文件夹路径:cf.文件夹路径||''});
      }
    }
    const idx=getFileIndex();
    let changed=false;
    for(const f of idx){
      if(!f.id||f.id.trim()===''){f.id=genFileId();f.isNewFile=true;changed=true}
      if(f.version===undefined){f.version=0;changed=true}
      if(f.lastSyncVersion===undefined){f.lastSyncVersion=0;changed=true}
    }
    if(changed)setFileIndex(idx);
  }
  btn.disabled=false;btn.textContent='刷新云端';

  if(!newName.endsWith('.txt'))newName+='.txt';
  if(newName===oldName){toast('文件名未变化');return}
  const meta=getFileMeta(oldName);
  const config=getSyncConfig();
  if(config.enabled){
    const cloudResult=await findFileInCloudById(meta.id);
    if(!cloudResult.networkOk){toast('网络异常，重命名中止');return}
    if(cloudResult.file&&cloudResult.file._行号){
      const netTime=await getNetworkTime();
      const result=await callCloudAPI('批量写入',{行号:cloudResult.file._行号,数据:{ID:meta.id,文件名:newName,文件夹路径:meta.folder||'',最后上传发起时间:new Date(netTime).toISOString()}});

        else toast('上传失败');
      }else{
        const cloudVer=parseInt(cloudResult.file.版本号||'0');
        if(localVer>=cloudVer&&localVer>0){
          const netTime=await getNetworkTime();
          const wr=await callCloudAPI('批量写入',{行号:cloudResult.file._行号,数据:{ID:meta.id,文件名:currentFileName,内容:content,版本号:localVer.toString(),文件夹路径:meta.folder||'',最后上传发起时间:new Date(netTime).toISOString()}});
          if(wr.status==='success'){setLastSyncVersion(currentFileName,localVer);clearNewFileFlag(meta.id);setLastSyncTime(Date.now());toast('已上传覆盖云端')}
          else toast('上传失败');
        }else if(cloudVer>localVer){
          const cloudContent=cloudResult.file.内容||'';
          saveFileData(currentFileName,cloudContent);

  },'单文件同步');
}

async function syncAllFiles(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return}
  if(syncMutex){toast('同步排队中，请稍候');return}
  await enqueueSync(async()=>{
    const btn=document.getElementById('syncAllBtn');
    const status=document.getElementById('fileSyncStatus');
    btn.disabled=true;btn.textContent='同步中...';
    status.style.display='block';status.style.color='#666';
    status.textContent='正在同步全部文件...';
    let uploaded=0,downloaded=0,deleted=0,skipped=0,errors=0;
    try{
      const cloudResult=await callCloudAPI('读取全部');
      if(cloudResult.status!=='success'||!cloudResult.数据){
        status.style.color='#e74c3c';status.textContent='获取云端数据失败';
        btn.disabled=false;btn.textContent='全部同步';return;
      }
      const cloudFiles=cloudResult.数据;
      const cloudIds=new Set();const cloudById=new Map();
      for(const cf of cloudFiles){if(cf.ID&&cf.ID.trim()){cloudIds.add(cf.ID);cloudById.set(cf.ID,cf)}}
      const idx=getFileIndex();
      for(const f of idx){if(!f.id||f.id.trim()===''){f.id=genFileId();f.isNewFile=true}if(f.version===undefined)f.version=0;if(f.lastSyncVersion===undefined)f.lastSyncVersion=0}
      setFileIndex(idx);
      for(const cf of cloudFiles){
        if(!cf.ID||cf.ID.trim()==='')continue;
        if(!cf.文件名||cf.文件名.trim()==='')continue;
        const localFile=idx.find(f=>f.id===cf.ID);
        if(!localFile){
          idx.push({name:cf.文件名,time:Date.now(),id:cf.ID,version:parseInt(cf.版本号||'0'),lastSyncVersion:parseInt(cf.版本号||'0'),folder:cf.文件夹路径||''});
          setFileIndex(idx);
          if(cf.内容)saveFileData(cf.文件名,cf.内容);
          downloaded++;
        }else{
          const localVer=localFile.version||0;
          const cloudVer=parseInt(cf.版本号||'0');
          if(cloudVer>localVer&&!hasLocalEdits(localFile.name)){
            if(cf.内容){syncLocalFileName(localFile,cf.文件名);setFileIndex(idx);saveFileData(localFile.name,cf.内容);localFile.version=cloudVer;localFile.lastSyncVersion=cloudVer}
            downloaded++;
          }else if(cloudVer>localVer){skipped++}
        }
      }
      for(let i=idx.length-1;i>=0;i--){
        const f=idx[i];if(cloudIds.has(f.id))continue;if(f.isNewFile)continue;
        deleteFileData(f.name);idx.splice(i,1);deleted++;
      }
      setFileIndex(idx);
      for(const f of idx){
        try{
          const fd=loadFileData(f.name);if(!fd||!fd.data)continue;
          const cloudLookup=await findFileInCloudById(f.id);
          if(!cloudLookup.networkOk){errors++;continue}
          if(!cloudLookup.file){
            const netTime=await getNetworkTime();const newRow=await findFirstEmptyRow();
            const wr=await callCloudAPI('批量写入',{行号:newRow,数据:{ID:f.id,文件名:f.name,内容:fd.data,版本号:(f.version||0).toString(),文件夹路径:f.folder||'',最后上传发起时间:new Date(netTime).toISOString()}});
            if(wr.status==='success'){setLastSyncVersion(f.name,f.version||0);clearNewFileFlag(f.id);uploaded++}else errors++;
          }else{
            const cloudFile=cloudLookup.file;const cloudVer=parseInt(cloudFile.版本号||'0');
            if((f.version||0)>cloudVer){
              const netTime=await getNetworkTime();
              const wr=await callCloudAPI('批量写入',{行号:cloudFile._行号,数据:{ID:f.id,文件名:f.name,内容:fd.data,版本号:(f.version||0).toString(),文件夹路径:f.folder||'',最后上传发起时间:new Date(netTime).toISOString()}});
              if(wr.status==='success'){setLastSyncVersion(f.name,f.version||0);clearNewFileFlag(f.id);uploaded++}else errors++;
            }
          }
        }catch(e){errors++}
      }
      for(const cf of cloudFiles){
        if(cf.ID&&cf.ID.trim())continue;if(!cf.文件名||cf.文件名.trim()==='')continue;
        const localByName=idx.find(f=>f.name===cf.文件名);
        if(!localByName){
          try{
            const lookup=await callCloudAPI('查找',{列名:'文件名',关键字:cf.文件名});
            if(lookup.status==='success'&&lookup.匹配数>0&&lookup.数据[0]._行号){
              callCloudAPI('批量写入',{行号:lookup.数据[0]._行号,数据:{ID:'',文件名:'',内容:'',版本号:'',文件夹路径:'',同步时间:'',最后上传发起时间:'',最后编辑时间:''}}).catch(()=>{});
            }
          }catch(e){}
        }
      }
    }catch(e){errors++}
    renderFileList();
    status.style.color=errors?'#e67e22':'#27ae60';
    let msg='同步完成 | 上传: '+uploaded+' | 下载: '+downloaded+' | 远程删除: '+deleted;
    if(skipped)msg+=' | 有编辑跳过: '+skipped;
    if(errors)msg+=' | 错误: '+errors;
    status.textContent=msg;
    btn.disabled=false;btn.textContent='全部同步';
    setLastSyncTime(Date.now());
    refreshCloudList();
    notifyParent('syncStatusChanged',{});
  },'全部同步');
}

  const allFolders=new Set();
  for(const item of idx){if(item.folder)allFolders.add(item.folder)}
  for(const[id,cf]of cloudFileCache){if(cf.文件夹路径)allFolders.add(cf.文件夹路径)}
  function getMoveSubFolders(parent){
    const subs=new Set();
    for(const fd of allFolders){
      if(!parent){if(!fd.includes('/'))subs.add(fd)}
      else{if(fd.startsWith(parent+'/')){const rest=fd.slice(parent.length+1);if(!rest.includes('/'))subs.add(rest)}}
    }
    return Array.from(subs).sort();
  }
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10000';
  const box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:12px;padding:16px;max-width:320px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.3);max-height:60vh;display:flex;flex-direction:column';
  function renderFolderList(parentPath){
    const subs=getMoveSubFolders(parentPath);
    let html='<div style="margin-bottom:6px;font-size:11px;color:#888">';
    if(!parentPath){html+='<span style="font-weight:bold">🏠 根目录</span>'}
    else{
      html+='<span style="cursor:pointer" onclick="this.closest(\'div\').__nav(\'\')">🏠</span> / ';
      const parts=parentPath.split('/');
      for(let i=0;i<parts.length;i++){const p=parts.slice(0,i+1).join('/');const isLast=i===parts.length-1;html+=`<span style="cursor:pointer;${isLast?'font-weight:bold':''}" onclick="this.closest('div').__nav('${encodeURIComponent(p)}')">${parts[i]}</span>`;if(!isLast)html+=' / '}
    }
    html+='</div><div style="flex:1;overflow-y:auto">';
    if(parentPath)html+=`<button data-move-folder="${encodeURIComponent(parentPath)}" style="display:block;width:100%;text-align:left;padding:6px 10px;margin:3px 0;border:1px solid #4A90D9;border-radius:4px;background:${(f.folder||'')===parentPath?'#e8f0fe':'#fff'};cursor:pointer;font-size:12px;color:#4A90D9">✓ 移动到此文件夹</button>`;
    else html+=`<button data-move-folder="" style="display:block;width:100%;text-align:left;padding:6px 10px;margin:3px 0;border:1px solid #4A90D9;border-radius:4px;background:${(f.folder||'')===''?'#e8f0fe':'#fff'};cursor:pointer;font-size:12px;color:#4A90D9">✓ 移动到根目录</button>`;
    for(const sub of subs){
      const fullPath=parentPath?parentPath+'/'+sub:sub;
      html+=`<button data-nav-folder="${encodeURIComponent(fullPath)}" style="display:block;width:100%;text-align:left;padding:6px 10px;margin:3px 0;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:12px">📁 ${sub} ▸</button>`;
    }
    html+='</div>';return html;
  }
  box.innerHTML='<h4 style="margin:0 0 8px;font-size:13px">移动 "'+f.name+'" 到：</h4><div id="moveFolderContent">'+renderFolderList('')+'</div><div style="margin-top:6px;display:flex;gap:4px"><input id="newFolderInput" type="text" placeholder="新文件夹路径" style="flex:1;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:11px"><button id="moveToNewFolder" style="padding:4px 10px;border:none;border-radius:4px;background:#4A90D9;color:#fff;cursor:pointer;font-size:11px">新建并移动</button></div><button id="moveCancel" style="margin-top:6px;padding:4px 12px;border:1px solid #ddd;border-radius:4px;background:#f5f5f5;cursor:pointer;font-size:11px">取消</button>';
  modal.appendChild(box);document.body.appendChild(modal);
  box.__nav=function(path){
    const content=box.querySelector('#moveFolderContent');
    content.innerHTML=renderFolderList(path?decodeURIComponent(path):'');
    bindFolderButtons();
  };
  function bindFolderButtons(){
    box.querySelectorAll('[data-move-folder]').forEach(btn=>{
      btn.onclick=async()=>{const folder=decodeURIComponent(btn.getAttribute('data-move-folder'));document.body.removeChild(modal);await moveFileToFolder(f.id,folder)};
    });
    box.querySelectorAll('[data-nav-folder]').forEach(btn=>{
      btn.onclick=()=>{const folder=decodeURIComponent(btn.getAttribute('data-nav-folder'));const content=box.querySelector('#moveFolderContent');content.innerHTML=renderFolderList(folder);bindFolderButtons()};
    });
  }
  bindFolderButtons();
  box.querySelector('#moveToNewFolder').onclick=async()=>{const newFolder=box.querySelector('#newFolderInput').value.trim();if(!newFolder){toast('请输入文件夹路径');return}document.body.removeChild(modal);await moveFileToFolder(f.id,newFolder)};
  box.querySelector('#moveCancel').onclick=()=>{document.body.removeChild(modal)};
}

function deleteSelectedFile(){
  const activeItem=document.querySelector('.file-item.active');
  if(!activeItem){toast('请先选择一个文件');return}
  const fid=activeItem.getAttribute('data-id');
  if(fid)deleteFileById(fid);
}

async function deleteFileById(id){
  if(!id)return;
  const idx=getFileIndex();const f=idx.find(x=>x.id===id);
  if(!f){toast('文件不存在');return}
  const name=f.name;
  if(!confirm('确定删除 "'+name+'" ？'))return;
  const config=getSyncConfig();
  if(config.enabled){
    const cloudResult=await findFileInCloudById(id);
    if(!cloudResult.networkOk){toast('网络异常，删除中止');return}
    if(cloudResult.file&&cloudResult.file._行号){
      const result=await callCloudAPI('批量写入',{行号:cloudResult.file._行号,数据:{ID:'',文件名:'',内容:'',版本号:'',文件夹路径:'',同步时间:'',最后上传发起时间:'',最后编辑时间:''}});
      if(result.status!=='success'){toast('云端删除失败');return}
      setLastSyncTime(Date.now());
    }
  }
  deleteFileDataById(id);
  if(currentFileName===name){currentFileName='';currentFileContent='';notifyParent('fileDeleted',{name})}
  renderFileList();
  toast('已删除：'+name);
}

function closeSelf(){
  if(window.parent!==window){
    window.parent.postMessage({type:'closeFileManager'},'*');
  }
}

function toast(msg){
  let t=document.getElementById('toast-el');
  if(!t){t=document.createElement('div');t.id='toast-el';t.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:6px 16px;border-radius:6px;font-size:12px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none';document.body.appendChild(t)}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(toast._timer);toast._timer=setTimeout(()=>{t.style.opacity='0'},1000);
}

function notifyParent(type,data){
  if(window.parent!==window){
    window.parent.postMessage(Object.assign({type:type},data||{}),'*');
  }
}

window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  const msg=e.data;
  if(msg.target!=='fileManager')return;
  switch(msg.type){
    case 'init':
    case 'open':
      currentFileName=msg.currentFileName||'';
      currentFileContent=msg.currentContent||'';
      document.getElementById('fileNameInput').value=currentFileName.replace('.txt','');
      updateFolderPath();
      renderFileList();
      refreshCloudList();
      break;
    case 'updateCurrentFile':
      currentFileName=msg.name||'';
      currentFileContent=msg.content||'';
      document.getElementById('fileNameInput').value=currentFileName.replace('.txt','');
      renderFileList();
      break;
    case 'open':
      currentFileName=msg.currentFileName||'';
      currentFileContent=msg.currentContent||'';
      document.getElementById('fileNameInput').value=currentFileName.replace('.txt','');
      currentFolder='';
      updateFolderPath();
      renderFileList();
      refreshCloudList();
      break;
    case 'syncCurrentFromMain':
      syncCurrentFile();
      break;
  }
});
</script>
</body>
</html>
