      <div style="grid-column:1/-1"><label style="font-size:12px;margin-top:0">Webhook 地址</label><input id="syncWebhookUrl" type="text" placeholder="https://www.kdocs.cn/api/v3/ide/file/..." style="width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-top:2px"></div>

<script>
const SYNC_CONFIG_KEY='mindmap_sync_config';
const PRIMARY_API_URLS=['https://1408347752-dxgsap4qrj.ap-guangzhou.tencentscf.com'];
const FALLBACK_API_URLS=[];
const DEFAULT_SYNC_CONFIG={enabled:true,apiUrl:PRIMARY_API_URLS[0],webhookUrl:'https://www.kdocs.cn/api/v3/ide/file/ctRsEvOpYZky/script/V2-1cf9aRSXUlNao8Qhjk4ATb/sync_task',token:'',autoSaveInterval:5,cloudCheckInterval:5,syncThreshold:10,syncDeltaInterval:5,sheetName:'自用脑图',retryCount:5,retryInterval:2};

let syncConfig=null;
let cloudFileCache=new Map();
let currentFolder='';
let currentFileName='';
let currentFileContent='';
let syncMutex=false;
let syncQueue=[];
let conflictResolver=null;
let pendingCloudVersion=null;
let conflictContext='';
let lastSyncTime=0;
let _networkTime=null;
let _networkTimeFetched=0;
let autoSyncTimer=null;
let autoSyncCheckTimer=null;
let lastAutoSyncTime=0;
let lastDeltaSyncTime=0;

function syncCurrentFileFromLocal(){
  const name=localStorage.getItem('mindmap_current_file')||'';
  if(!name)return;
  currentFileName=name;
  const meta=getFileMeta(name);
  if(meta&&meta.id){
    const fd=loadFileDataById(meta.id);
    if(fd&&fd.data)currentFileContent=fd.data;
  }
  if(!currentFileContent){
    const fd=loadFileData(name);
    if(fd&&fd.data)currentFileContent=fd.data;
  }
}

function formatBeijingTime(ts){
  const d=new Date(ts||Date.now());
  const offset=d.getTimezoneOffset();
  const bjTime=new Date(d.getTime()-offset*60000+8*3600000);
  const pad=n=>String(n).padStart(2,'0');
  return bjTime.getFullYear()+'-'+pad(bjTime.getMonth()+1)+'-'+pad(bjTime.getDate())+' '+pad(bjTime.getHours())+':'+pad(bjTime.getMinutes())+':'+pad(bjTime.getSeconds());
}

function getLastEditTime(){
  return localStorage.getItem('mindmap_last_edit_time')||'';
}

function notifyParent(type,data){
  if(window.parent&&window.parent!==window){
    window.parent.postMessage({type,...data},'*');
  }
}

function closeSelf(){
  notifyParent('closeFileManager',{});
}

function genFileId(){return Math.floor(1000000000+Math.random()*9000000000).toString()}

function getSyncConfig(){
  if(!syncConfig){
    try{const saved=localStorage.getItem(SYNC_CONFIG_KEY);syncConfig=saved?JSON.parse(saved):{...DEFAULT_SYNC_CONFIG}}
    catch(e){syncConfig={...DEFAULT_SYNC_CONFIG}}
  }
  if(!syncConfig.apiUrl||!PRIMARY_API_URLS.includes(syncConfig.apiUrl)){
    syncConfig.apiUrl=PRIMARY_API_URLS[0];
    saveSyncConfig(syncConfig);
  }
  if(syncConfig.syncDeltaInterval===undefined){syncConfig.syncDeltaInterval=DEFAULT_SYNC_CONFIG.syncDeltaInterval;saveSyncConfig(syncConfig)}
  if(syncConfig.syncThreshold===undefined||syncConfig.syncThreshold<1){syncConfig.syncThreshold=DEFAULT_SYNC_CONFIG.syncThreshold;saveSyncConfig(syncConfig)}
  return syncConfig;
}

function saveSyncConfig(config){syncConfig=config;try{localStorage.setItem(SYNC_CONFIG_KEY,JSON.stringify(config))}catch(e){}}

function getFileIndex(){try{return JSON.parse(localStorage.getItem('mindmap_file_index')||'[]')}catch(e){return[]}}
function setFileIndex(idx){try{localStorage.setItem('mindmap_file_index',JSON.stringify(idx))}catch(e){}}

function getFileMeta(name){
  try{
    const idx=getFileIndex();
    const f=idx.find(x=>x.name===name);
    if(!f){
      const newEntry={name,id:genFileId(),version:0,lastSyncVersion:0,isNewFile:true,folder:currentFolder||''};
      idx.push(newEntry);
      setFileIndex(idx);
      return newEntry;
    }
    if(!f.id){f.id=genFileId();f.isNewFile=true}
    if(f.lastSyncVersion===undefined){f.lastSyncVersion=f.version||0;setFileIndex(idx)}
    return f;
  }catch(e){return{name,id:genFileId(),version:0,lastSyncVersion:0,isNewFile:true}}
}

function getFileVersion(name){const meta=getFileMeta(name||currentFileName);return meta.version||0}
function setFileVersion(name,ver){const idx=getFileIndex();const f=idx.find(x=>x.name===name);if(f){f.version=ver;setFileIndex(idx)}}
function getLastSyncVersion(name){const meta=getFileMeta(name||currentFileName);return meta.lastSyncVersion||0}
function setLastSyncVersion(name,ver){const idx=getFileIndex();const f=idx.find(x=>x.name===name);if(f){f.lastSyncVersion=ver;setFileIndex(idx)}}
function clearNewFileFlag(id){const idx=getFileIndex();const f=idx.find(x=>x.id===id);if(f&&f.isNewFile){f.isNewFile=false;setFileIndex(idx)}}
function setNewFileFlag(id){const idx=getFileIndex();const f=idx.find(x=>x.id===id);if(f){f.isNewFile=true;setFileIndex(idx)}}
function isNewFileById(id){const idx=getFileIndex();const f=idx.find(x=>x.id===id);return f&&f.isNewFile}

function hasLocalEdits(name){const meta=getFileMeta(name||currentFileName);return(meta.version||0)!==(meta.lastSyncVersion||0)}

function bumpFileVersion(name){
  const n=name||currentFileName;
  if(!n)return;
  const idx=getFileIndex();
  const f=idx.find(x=>x.name===n);
  if(f){f.version=(f.version||0)+1;setFileIndex(idx)}
}

function getLastSyncTime(){try{return parseInt(localStorage.getItem('mindmap_last_sync_time')||'0')}catch(e){return 0}}
function setLastSyncTime(t){lastSyncTime=t;try{localStorage.setItem('mindmap_last_sync_time',t.toString())}catch(e){}}

function saveFileData(name,data){
  const idx=getFileIndex();
  const existing=idx.find(f=>f.name===name);
  let fileId;
  if(existing){
    existing.time=Date.now();
    if(!existing.id){existing.id=genFileId();existing.isNewFile=true}
    if(existing.version===undefined)existing.version=0;
    if(existing.lastSyncVersion===undefined)existing.lastSyncVersion=0;
    fileId=existing.id;
  }else{
    fileId=genFileId();
    idx.push({name,time:Date.now(),id:fileId,version:0,lastSyncVersion:0,isNewFile:true,folder:currentFolder||''});
  }
  setFileIndex(idx);
  try{
    const oldRaw=localStorage.getItem('mindmap_file_id_'+fileId);
    const oldObj=oldRaw?JSON.parse(oldRaw):{};
    localStorage.setItem('mindmap_file_id_'+fileId,JSON.stringify({data,view:oldObj.view||{zoom:1,panX:0,panY:0}}));
  }catch(e){toast('存储空间不足')}
  return fileId;
}

function loadFileData(name){
  try{
    const idx=getFileIndex();const f=idx.find(x=>x.name===name);
    if(!f||!f.id)return null;
    const raw=localStorage.getItem('mindmap_file_id_'+f.id);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}

function loadFileDataById(id){
  try{
    if(!id)return null;
    const raw=localStorage.getItem('mindmap_file_id_'+id);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}

function deleteFileDataById(id){
  if(!id)return;
  const idx=getFileIndex();
  const f=idx.find(x=>x.id===id);
  if(f)localStorage.removeItem('mindmap_file_id_'+id);
  const newIdx=idx.filter(x=>x.id!==id);
  setFileIndex(newIdx);
}

function deleteFileData(name){
  const idx=getFileIndex();
  const f=idx.find(x=>x.name===name);
  if(f&&f.id)localStorage.removeItem('mindmap_file_id_'+f.id);
  const newIdx=idx.filter(x=>x.name!==name);
  setFileIndex(newIdx);
}

function syncLocalFileName(localFile,cloudFileName){
  if(!cloudFileName||cloudFileName===localFile.name)return false;
  const oldName=localFile.name;
  const fd=loadFileData(oldName);
  if(fd&&localFile.id){
    localStorage.removeItem('mindmap_file_id_'+localFile.id);
    localStorage.setItem('mindmap_file_id_'+localFile.id,JSON.stringify({data:fd.data,view:fd.view||{zoom:1,panX:0,panY:0}}));
  }
  localFile.name=cloudFileName;
  if(oldName===currentFileName){
    currentFileName=cloudFileName;
  }
  return true;
}

function _applyServerDate(dateStr){
  if(!dateStr)return false;
  try{
    const t=new Date(dateStr).getTime();
    if(!isNaN(t)&&t>1600000000000){_networkTime=t;_networkTimeFetched=Date.now();return true}
  }catch(e){}
  return false;
}

async function getNetworkTime(){
  const now=Date.now();
  if(_networkTime&&now-_networkTimeFetched<300000)return _networkTime+(now-_networkTimeFetched);
  const tryUrls=[
    'https://worldtimeapi.org/api/timezone/Etc/UTC',
    'https://timeapi.io/api/time/current/zone?timeZone=UTC',
    'https://timeapi.io/api/Time/current/zone?timeZone=UTC'
  ];
  for(const url of tryUrls){
    try{
      const ctrl=new AbortController();
      const tid=setTimeout(()=>ctrl.abort(),4000);
      const res=await fetch(url,{signal:ctrl.signal});
      clearTimeout(tid);
      const dateHeader=res.headers.get('Date');
      if(dateHeader&&_applyServerDate(dateHeader))return _networkTime+(Date.now()-_networkTimeFetched);
      const data=await res.json();
      const timeField=data.utc_datetime||data.dateTime||data.datetime;
      if(timeField&&_applyServerDate(timeField+'Z'))return _networkTime+(Date.now()-_networkTimeFetched);
      if(data.unixtime){
        _networkTime=data.unixtime*1000;_networkTimeFetched=Date.now();
        return _networkTime+(Date.now()-_networkTimeFetched);
      }
    }catch(e){}
  }
  return Date.now();
}

async function callCloudAPI(action,params={}){
  const config=getSyncConfig();
  if(!config.enabled)return{status:'error',message:'云同步未启用',isNetworkError:false};
  const payload={webhookUrl:config.webhookUrl,message:{Context:{argv:{表格名:config.sheetName,操作:action,...params}}}};
  const headers={'Content-Type':'application/json'};
  if(config.token)headers['AirScript-Token']=config.token;
  const allUrls=[...PRIMARY_API_URLS,...FALLBACK_API_URLS];
  const maxRetries=config.retryCount||5;
  const retryInterval=config.retryInterval||2;
  const fetchTimeout=30000;
  for(const apiUrl of allUrls){
    let lastError=null;
    let lastIsNetworkError=true;
    for(let attempt=0;attempt<maxRetries;attempt++){
      try{
        const ctrl=new AbortController();
        const tid=setTimeout(()=>ctrl.abort(),fetchTimeout);
        const response=await fetch(apiUrl,{method:'POST',headers,body:JSON.stringify(payload),signal:ctrl.signal});
        clearTimeout(tid);
        if(!response.ok)throw new Error('HTTP '+response.status);
        const dateHeader=response.headers.get('Date');
        if(dateHeader)_applyServerDate(dateHeader);
        const result=await response.json();
        const r=result.data?.result||result;
        if(r.status==='success')return r;
        if(r.tongzhi){
          const netKeywords=['网络','超时','timeout','ECONNRESET','ENOTFOUND','fetch','Failed to fetch','NetworkError','Network request'];
          const isNet=netKeywords.some(k=>r.tongzhi.includes(k));
          if(!isNet)return{...r,isNetworkError:false};
          lastError=new Error(r.tongzhi);lastIsNetworkError=true;
        }else{
          lastError=new Error(r.message||JSON.stringify(r).slice(0,100)||'未知错误');lastIsNetworkError=true;
        }
      }catch(error){
        if(error.name==='AbortError')lastError=new Error('请求超时('+fetchTimeout/1000+'秒)');
        else lastError=error;
        lastIsNetworkError=true;
      }
      if(attempt<maxRetries-1)await new Promise(r=>setTimeout(r,retryInterval*1000));
    }
  }
  return{status:'error',message:lastError?.message||'所有云函数地址均不可用',isNetworkError:lastIsNetworkError};
}

async function findFirstEmptyRow(){
  const result=await callCloudAPI('获取维度');
  if(result.status==='success'&&result.最大行)return result.最大行+1;
  return 2;
}

async function findFileInCloudById(fileId){
  if(!fileId)return{file:null,networkOk:false};
  const result=await callCloudAPI('查找',{列名:'ID',关键字:fileId});
  if(result.status==='success'){
    if(result.匹配数>0)return{file:result.数据[0],networkOk:true};
    return{file:null,networkOk:true};
  }
  if(result.isNetworkError)return{file:null,networkOk:false};
  return{file:null,networkOk:true};
}

async function findFileInCloud(fileName){
  const name=fileName||currentFileName||'';
  const result=await callCloudAPI('查找',{列名:'文件名',关键字:name});
  if(result.status==='success'&&result.匹配数>0)return result.数据[0];
  return null;
}

function enqueueSync(fn,label){
  return new Promise((resolve,reject)=>{
    const existing=syncQueue.findIndex(t=>t.label===label);
    if(existing!==-1){const old=syncQueue[existing];old.fn=fn;old.resolve=resolve;old.reject=reject}
    else syncQueue.push({fn,label,resolve,reject});
    processSyncQueue();
  });
}

function processSyncQueue(){
  if(syncMutex||syncQueue.length===0)return;
  syncMutex=true;
  const task=syncQueue.shift();
  task.fn().then(task.resolve).catch(task.reject).finally(()=>{syncMutex=false;processSyncQueue()});
}

function getSubFolders(parentFolder){
  const idx=getFileIndex();
  const subFolders=new Set();
  const prefix=parentFolder?parentFolder+'/':'';
  for(const f of idx){
    const fd=f.folder||'';
    if(!fd)continue;
    if(parentFolder){
      if(fd.startsWith(prefix)){const rest=fd.slice(prefix.length);if(rest&&!rest.includes('/'))subFolders.add(rest)}
    }else{
      if(!fd.includes('/'))subFolders.add(fd);
    }
  }
  for(const[id,cf]of cloudFileCache){
    const fd=cf.文件夹路径||'';
    if(!fd)continue;
    if(parentFolder){
      if(fd.startsWith(prefix)){const rest=fd.slice(prefix.length);if(rest&&!rest.includes('/'))subFolders.add(rest)}
    }else{
      if(!fd.includes('/'))subFolders.add(fd);
    }
  }
  return Array.from(subFolders).sort();
}

function getFilesInFolder(folder){
  const idx=getFileIndex();
  const localIds=new Set();
  const files=[];
  for(const f of idx){
    const fFolder=f.folder||'';
    if(fFolder===folder){
      files.push({...f,source:'local'});
      localIds.add(f.id);
    }
  }
  for(const[id,cf]of cloudFileCache){
    if(!localIds.has(id)){
      const cfFolder=cf.文件夹路径||'';
      if(cfFolder===folder&&cf.文件名&&cf.文件名.trim()){
        files.push({id,name:cf.文件名,version:parseInt(cf.版本号||'0'),folder:cfFolder,source:'cloud'});
      }
    }
  }
  return files.sort((a,b)=>(b.time||0)-(a.time||0)||a.name.localeCompare(b.name));
}

function getFileSyncStatus(localFile){
  if(localFile.isNewFile)return{label:'本地新文件',color:'#3498DB',icon:'🆕'};
  const cloud=cloudFileCache.get(localFile.id);
  if(!cloud)return{label:'待上传',color:'#e67e22',icon:'📤'};
  const cloudVer=parseInt(cloud.版本号||'0');
  const localVer=localFile.version||0;
  if(localVer===cloudVer)return{label:'与云端一致',color:'#27ae60',icon:'✅'};
  if(localVer<cloudVer){
    if(hasLocalEdits(localFile.name))return{label:'与云端版本冲突',color:'#e74c3c',icon:'⚠️'};
    return{label:'版本落后于云端',color:'#f39c12',icon:'⬇️'};
  }
  return{label:'待上传',color:'#e67e22',icon:'📤'};
}

async function acceptCloudVersion(){
  try{
    toast('正在获取云端版本...');
    syncCurrentFileFromLocal();
    const fileName=currentFileName||'';
    if(!fileName){toast('无法接受：缺少文件名');closeSyncConflict();return}
    const meta=getFileMeta(fileName);
    const cloudResult=await findFileInCloudById(meta.id);
    if(!cloudResult.networkOk){
      toast('网络异常，无法获取云端文件');
      closeSyncConflict();
      return;
    }
    if(cloudResult.file){
      const content=cloudResult.file.内容||'';
      const cloudFileName=cloudResult.file.文件名||fileName;
      const cloudVer=parseInt(cloudResult.file.版本号||'0');
      const idx=getFileIndex();
      const localEntry=idx.find(x=>x.id===meta.id);
      const needRename=localEntry?syncLocalFileName(localEntry,cloudFileName):false;
      if(needRename)setFileIndex(idx);
      setFileVersion(currentFileName,cloudVer);
      setLastSyncVersion(currentFileName,cloudVer);
      clearNewFileFlag(meta.id);
      saveFileData(currentFileName,content);
      setLastSyncTime(Date.now());
      currentFileContent=content;
      notifyParent('fileContentUpdated',{name:currentFileName,content});
      renderFileList();
      toast('已更新为云端版本'+(needRename?' → '+cloudFileName:''));
    }
    closeSyncConflict();
  }catch(e){
    toast('接受云端版本异常：'+e.message);
    closeSyncConflict();
  }
}

async function saveConflictVersion(){
  try{
    toast('正在创建冲突版本...');
    syncCurrentFileFromLocal();
    if(!currentFileName){closeSyncConflict();return}
  const netTime=await getNetworkTime();
  const ts=formatBeijingTime(netTime).replace(/[-: ]/g,'').substring(0,14);
  const conflictName=currentFileName.replace('.txt','')+'冲突版本'+ts+'.txt';
  const originalFileName=currentFileName;
  const content=currentFileContent;
  const oldMeta=getFileMeta(originalFileName);
  const oldId=oldMeta.id;
  const newId=genFileId();
  const idx=getFileIndex();
  const localEntry=idx.find(x=>x.id===oldId);
  if(localEntry){
    const fd=loadFileData(localEntry.name);
    if(fd){
      localStorage.removeItem('mindmap_file_id_'+oldId);
      localStorage.setItem('mindmap_file_id_'+newId,JSON.stringify({data:fd.data,view:fd.view||{zoom:1,panX:0,panY:0}}));
    }
    localEntry.name=conflictName;
    localEntry.id=newId;
    localEntry.version=1;
    localEntry.lastSyncVersion=0;
    localEntry.isNewFile=true;
    setFileIndex(idx);
  }
  const newRow=await findFirstEmptyRow();
  const writeResult=await callCloudAPI('批量写入',{
    行号:newRow,
    数据:{ID:newId,文件名:conflictName,内容:content,版本号:'1',文件夹路径:getFileMeta(conflictName).folder||'',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
  });
  if(writeResult.status==='success'){
    setLastSyncTime(Date.now());
    setLastSyncVersion(conflictName,1);
    clearNewFileFlag(newId);
  }
  const cloudResult=await findFileInCloudById(oldId);
  if(cloudResult.networkOk&&cloudResult.file){
    const cloudContent=cloudResult.file.内容||'';
    const cloudVer=parseInt(cloudResult.file.版本号||'0');
    const cloudFileName=cloudResult.file.文件名||originalFileName;
    const cloudFolder=cloudResult.file.文件夹路径||'';
    const existingCloudLocal=idx.find(x=>x.id===oldId&&x.name!==conflictName);
    if(!existingCloudLocal){
      idx.push({name:cloudFileName,time:Date.now(),id:oldId,version:cloudVer,lastSyncVersion:cloudVer,folder:cloudFolder});
    }else{
      existingCloudLocal.version=cloudVer;
      existingCloudLocal.lastSyncVersion=cloudVer;
      if(cloudFileName!==existingCloudLocal.name)existingCloudLocal.name=cloudFileName;
    }
    setFileIndex(idx);
    saveFileData(cloudFileName,cloudContent);
  }
  currentFileName=conflictName;
  currentFileContent=content;
  localStorage.setItem('mindmap_current_file',conflictName);
  notifyParent('openFile',{name:conflictName,content,id:newId});
  renderFileList();
  toast('已创建冲突版本(新ID): '+conflictName+'，云端版本已下载到本地');
  closeSyncConflict();
  }catch(e){
    toast('创建冲突版本异常：'+e.message);
    closeSyncConflict();
  }
}

async function overwriteCloudWithLocal(){
  try{
    toast('正在覆盖云端...');
    syncCurrentFileFromLocal();
    const fileName=currentFileName||'';
    const content=currentFileContent;
    if(!fileName||!content){toast('无法覆盖：缺少文件名或内容');closeSyncConflict();return}
    const meta=getFileMeta(fileName);
    const cloudVer=pendingCloudVersion||0;
    const newVersion=cloudVer+10;
    const netTime=await getNetworkTime();
    const cloudResult=await findFileInCloudById(meta.id);
    if(!cloudResult.networkOk){
      toast('网络异常，无法确认云端状态');
      closeSyncConflict();
      return;
    }
    let writeResult;
    if(cloudResult.file){
      writeResult=await callCloudAPI('批量写入',{
        行号:cloudResult.file._行号,
        数据:{ID:meta.id,文件名:fileName,内容:content,版本号:newVersion.toString(),文件夹路径:meta.folder||'',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
      });
    }else{
      const newRow=await findFirstEmptyRow();
      writeResult=await callCloudAPI('批量写入',{
        行号:newRow,
        数据:{ID:meta.id,文件名:fileName,内容:content,版本号:newVersion.toString(),文件夹路径:meta.folder||'',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
      });
    }
    if(writeResult.status==='success'){
      setFileVersion(fileName,newVersion);
      setLastSyncVersion(fileName,newVersion);
      clearNewFileFlag(meta.id);
      setLastSyncTime(Date.now());
      toast('已用本地版本覆盖云端，版本: '+newVersion);
    }else{
      toast('覆盖云端失败：'+(writeResult.tongzhi||writeResult.message||'未知错误'));
    }
    closeSyncConflict();
  }catch(e){
    toast('覆盖云端异常：'+e.message);
    closeSyncConflict();
  }
}


function renderFileList(){
  const list=document.getElementById('fileList');
  const idx=getFileIndex().sort((a,b)=>b.time-a.time||a.name.localeCompare(b.name));
  const localIds=new Set(idx.map(f=>f.id));
  let html='';
  if(idx.length===0&&cloudFileCache.size===0){list.innerHTML='<div style="text-align:center;color:#999;padding:30px 0">暂无保存的文件</div>';return}
  const subFolders=getSubFolders(currentFolder);
  if(currentFolder){
    const parentFolder=currentFolder.includes('/')?currentFolder.slice(0,currentFolder.lastIndexOf('/')):'';
    html+=`<div class="file-item" style="background:#f0f0f0;cursor:pointer" onclick="navigateFolder('${encodeURIComponent(parentFolder)}')">
      <span class="file-name">⬆ 返回上级</span>
      <span class="file-time"></span>
    </div>`;
  }
  if(subFolders.length>0){
    for(const sub of subFolders){
      const fullPath=currentFolder?currentFolder+'/'+sub:sub;
      const count=getFilesInFolder(fullPath).length;
      html+=`<div class="file-item" style="background:#f5f0e8;cursor:pointer" data-folder="${encodeURIComponent(fullPath)}">
        <span class="file-name">📁 ${sub} <span style="font-size:9px;color:#999">(${count}个文件)</span></span>
        <span class="file-time"></span>
        <span class="file-del" data-del-folder="${encodeURIComponent(fullPath)}">✕</span>
      </div>`;
    }
  }
  const displayFiles=idx.filter(f=>(f.folder||'')===currentFolder);
  html+=displayFiles.map(f=>{
    const d=new Date(f.time);
    const ts=d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const active=f.name===currentFileName?' active':'';
    const enc=encodeURIComponent(f.name);
    const ver=f.version||0;
    const syncVer=f.lastSyncVersion||0;
    const fid=f.id||'';
    const status=getFileSyncStatus(f);
    const statusHtml=cloudFileCache.size>0?`<span style="font-size:9px;color:${status.color}" title="${status.label}">${status.icon}</span> `:'';
    const folderInfo=(!currentFolder&&f.folder)?`<span style="font-size:9px;color:#b8860b">📁${f.folder}</span> `:'';
    const cloud=cloudFileCache.get(fid);
    const cloudVerStr=cloud?`<span style="color:#9b59b6">☁${cloud.版本号||0}</span>`:'<span style="color:#ccc">☁-</span>';
    const verInfo=`<span style="font-size:9px;color:#999" title="本地v${ver} 共同v${syncVer}">${ver}</span><span style="font-size:9px;color:#aaa;margin:0 1px">/</span><span style="font-size:9px;color:#2ecc71" title="共同号(上次同步一致版本)">${syncVer}</span><span style="font-size:9px;color:#aaa;margin:0 1px">/</span>${cloudVerStr}`;
    return `<div class="file-item${active}" data-id="${fid}" data-name="${enc}">
      <span class="file-name">📄 ${f.name} ${verInfo} ${folderInfo}${statusHtml}</span>
      <span class="file-time">${ts}</span>
      <span class="file-del" data-del="${fid}">✕</span>
    </div>`;
  }).join('');
  if(cloudFileCache.size>0){
    const cloudOnly=[];
    for(const[cid,cf]of cloudFileCache){
      if(!localIds.has(cid)&&cf.文件名&&cf.文件名.trim()){
        const cfFolder=cf.文件夹路径||'';
        if(cfFolder===currentFolder){
          cloudOnly.push({id:cid,name:cf.文件名,ver:cf.版本号||'0',folder:cfFolder});
        }
      }
    }
    if(cloudOnly.length>0){
      html+='<div style="padding:4px 10px;font-size:10px;color:#999;border-top:1px solid #eee;margin-top:2px">☁️ 以下仅存于云端</div>';
      html+=cloudOnly.map(cf=>{
        return `<div class="file-item" data-id="${cf.id}" data-name="${encodeURIComponent(cf.name)}" style="opacity:0.7">
          <span class="file-name">☁️ ${cf.name} <span style="font-size:9px;color:#999">v${cf.ver}</span> <span style="font-size:9px;color:#9b59b6">仅存于云端</span></span>
          <span class="file-time">-</span>
        </div>`;
      }).join('');
    }
  }
  list.innerHTML=html;
}

document.getElementById('fileList').addEventListener('click',function(e){
  const del=e.target.closest('[data-del]');
  if(del){e.stopPropagation();deleteFileById(del.getAttribute('data-del'));return}
  const delFolder=e.target.closest('[data-del-folder]');
  if(delFolder){e.stopPropagation();deleteFolder(decodeURIComponent(delFolder.getAttribute('data-del-folder')));return}
  const folderItem=e.target.closest('[data-folder]');
  if(folderItem){e.stopPropagation();navigateFolder(decodeURIComponent(folderItem.getAttribute('data-folder')));return}
  const item=e.target.closest('[data-id]');
  if(item){
    const id=item.getAttribute('data-id');
    const name=decodeURIComponent(item.getAttribute('data-name'));
    document.getElementById('fileNameInput').value=name;
    const idx=getFileIndex();
    const localFile=idx.find(x=>x.id===id);
    if(localFile){
      openFileById(id);
    }else{
      downloadCloudFileById(id,name);
    }
  }
});

function navigateFolder(folder){
  currentFolder=folder?decodeURIComponent(folder):'';
  renderFileList();
  updateFolderPath();
}

function updateFolderPath(){
  const pathEl=document.getElementById('folderPath');
  if(!pathEl)return;
  if(!currentFolder){pathEl.innerHTML='<span style="cursor:pointer" onclick="navigateFolder(\'\')">/</span>';return}
  let html='<span style="cursor:pointer" onclick="navigateFolder(\'\')">/</span>';
  const parts=currentFolder.split('/');
  for(let i=0;i<parts.length;i++){
    const path=parts.slice(0,i+1).join('/');
    const isLast=i===parts.length-1;
    html+=`<span style="cursor:pointer;${isLast?'font-weight:bold':''}" onclick="navigateFolder('${encodeURIComponent(path)}')">${parts[i]}</span>`;
    if(!isLast)html+='<span style="color:#ccc">/</span>';
  }
  pathEl.innerHTML=html;
}

async function createFolder(){
  const name=prompt('请输入文件夹名称：');
  if(!name||!name.trim())return;
  const subName=name.trim();
  const fullFolderName=currentFolder?currentFolder+'/'+subName:subName;
  const subFolders=getSubFolders(currentFolder);
  if(subFolders.includes(subName)){toast('同名文件夹已存在');return}
  const config=getSyncConfig();
  if(config.enabled){
    toast('正在创建云端文件夹...');
    const netTime=await getNetworkTime();
    const folderId='FOLDER_'+genFileId();
    const newRow=await findFirstEmptyRow();
    const writeResult=await callCloudAPI('批量写入',{
      行号:newRow,
      数据:{ID:folderId,文件名:'',内容:'',版本号:'0',文件夹路径:fullFolderName,最后上传发起时间:formatBeijingTime(netTime)}
    });
    if(writeResult.status!=='success'){
      toast('云端创建文件夹失败：'+(writeResult.tongzhi||'未知错误'));

async function deleteFolder(folderName){
  if(!confirm('确定删除文件夹"'+folderName+'"及其所有子文件夹和文件？'))return;
  const config=getSyncConfig();
  const idx=getFileIndex();
  const filesInFolder=idx.filter(f=>{
    const fd=f.folder||'';
    return fd===folderName||fd.startsWith(folderName+'/');
  });
  if(config.enabled){
    toast('正在删除云端文件夹...');
    const cloudResult=await callCloudAPI('读取全部');
    if(cloudResult.status==='success'&&cloudResult.数据){
      const rowsToDelete=cloudResult.数据.filter(cf=>{
        const fd=cf.文件夹路径||'';
        return fd===folderName||fd.startsWith(folderName+'/');
      });
      for(const row of rowsToDelete){
        const rowId=row.ID||'';
        if(!rowId.trim())continue;
        const lookup=await callCloudAPI('查找',{列名:'ID',关键字:rowId});
        if(lookup.status==='success'&&lookup.匹配数>0&&lookup.数据[0]._行号){
          await callCloudAPI('批量写入',{
            行号:lookup.数据[0]._行号,
            数据:{ID:'',文件名:'',内容:'',版本号:'',文件夹路径:'',同步时间:'',最后上传发起时间:'',最后编辑时间:''}
          });
        }
      }
    }
  }
  for(const f of filesInFolder){
    if(f.id)localStorage.removeItem('mindmap_file_id_'+f.id);
  }
  const newIdx=idx.filter(f=>{
    const fd=f.folder||'';
    return fd!==folderName&&!fd.startsWith(folderName+'/');
  });
  setFileIndex(newIdx);
  if(currentFolder===folderName||currentFolder.startsWith(folderName+'/'))currentFolder='';
  toast('文件夹已删除：'+folderName);
  if(config.enabled)await refreshCloudList();
  renderFileList();
}

async function moveFileToFolder(fileId,folderName){
  const idx=getFileIndex();
  const f=idx.find(x=>x.id===fileId);
  if(!f){toast('文件不存在');return}
  const config=getSyncConfig();
  if(config.enabled&&!f.isNewFile){
    const cloudResult=await findFileInCloudById(fileId);
    if(cloudResult.networkOk){
      if(cloudResult.file&&cloudResult.file._行号){
        const netTime=await getNetworkTime();
        const cf=cloudResult.file;
        const writeResult=await callCloudAPI('批量写入',{
          行号:cf._行号,
          数据:{ID:fileId,文件名:cf.文件名||f.name,内容:cf.内容||'',版本号:cf.版本号||(f.version||0).toString(),文件夹路径:folderName,最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
        });
        if(writeResult.status!=='success'){
          if(writeResult.isNetworkError){
            toast('网络异常，云端移动失败');
          }else{
            toast('云端移动失败：'+(writeResult.tongzhi||writeResult.message||'业务错误'));
          }
          return;
        }
      }
    }else{
      toast('网络异常，移动中止');
      return;
    }
  }
  f.folder=folderName;
  setFileIndex(idx);
  toast('已移动到：'+(folderName||'根目录'));

}

function showMoveFileDialog(){
  const idx=getFileIndex();
  const activeItem=document.querySelector('.file-item.active');
  if(!activeItem&&!currentFileName){toast('请先选择一个文件');return}
  const fileId=activeItem?activeItem.getAttribute('data-id'):'';
  const f=fileId?idx.find(x=>x.id===fileId):null;
  if(!f){toast('请先选择一个文件');return}
  const allFolders=new Set();
  for(const item of idx){
    if(item.folder)allFolders.add(item.folder);
  }
  for(const[id,cf]of cloudFileCache){
    if(cf.文件夹路径)allFolders.add(cf.文件夹路径);
  }
  function getSubFoldersList(parent){
    const subs=new Set();
    for(const fd of allFolders){
      if(!parent){
        if(!fd.includes('/'))subs.add(fd);
      }else{
        if(fd.startsWith(parent+'/')){
          const rest=fd.slice(parent.length+1);
          if(!rest.includes('/'))subs.add(rest);
        }
      }
    }
    return Array.from(subs).sort();
  }
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10000';
  const box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:12px;padding:20px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.3);max-height:60vh;display:flex;flex-direction:column';
  let navPath='';
  function renderFolderList(parentPath){
    const subs=getSubFoldersList(parentPath);
    let html='<div style="margin-bottom:8px;font-size:12px;color:#888">';
    if(!parentPath){
      html+='<span style="font-weight:bold">🏠 根目录</span>';
    }else{
      html+='<span style="cursor:pointer" onclick="this.closest(\'.modal-box\').__nav(\'\')">🏠</span> / ';
      const parts=parentPath.split('/');
      for(let i=0;i<parts.length;i++){
        const p=parts.slice(0,i+1).join('/');
        const isLast=i===parts.length-1;
        html+=`<span style="cursor:pointer;${isLast?'font-weight:bold':''}" onclick="this.closest(\'.modal-box\').__nav('${encodeURIComponent(p)}')">${parts[i]}</span>`;
        if(!isLast)html+=' / ';
      }
    }
    html+='</div>';
    html+='<div style="flex:1;overflow-y:auto">';
    if(parentPath){
      html+=`<button data-move-folder="${encodeURIComponent(parentPath)}" style="display:block;width:100%;text-align:left;padding:8px 12px;margin:4px 0;border:1px solid #4A90D9;border-radius:6px;background:${(f.folder||'')===parentPath?'#e8f0fe':'#fff'};cursor:pointer;font-size:13px;color:#4A90D9">✓ 移动到此文件夹${(f.folder||'')===parentPath?' (当前)':''}</button>`;
    }else{
      html+=`<button data-move-folder="" style="display:block;width:100%;text-align:left;padding:8px 12px;margin:4px 0;border:1px solid #4A90D9;border-radius:6px;background:${(f.folder||'')===''?'#e8f0fe':'#fff'};cursor:pointer;font-size:13px;color:#4A90D9">✓ 移动到根目录${(f.folder||'')===''?' (当前)':''}</button>`;
    }
    for(const sub of subs){
      const fullPath=parentPath?parentPath+'/'+sub:sub;
      html+=`<button data-nav-folder="${encodeURIComponent(fullPath)}" style="display:block;width:100%;text-align:left;padding:8px 12px;margin:4px 0;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px">📁 ${sub} ▸</button>`;
    }
    html+='</div>';
    return html;
  }
  box.innerHTML='<h4 style="margin:0 0 12px;font-size:14px">移动 "'+f.name+'" 到：</h4>'+
    '<div id="moveFolderContent">'+renderFolderList('')+'</div>'+
    '<div style="margin-top:8px;display:flex;gap:6px"><input id="newFolderInput" type="text" placeholder="新文件夹路径（如：工作/项目A）" style="flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:4px;font-size:12px"><button id="moveToNewFolder" style="padding:6px 12px;border:none;border-radius:4px;background:#4A90D9;color:#fff;cursor:pointer;font-size:12px">新建并移动</button></div>'+
    '<button id="moveCancel" style="margin-top:8px;padding:6px 16px;border:1px solid #ddd;border-radius:4px;background:#f5f5f5;cursor:pointer;font-size:12px">取消</button>';
  modal.appendChild(box);
  document.body.appendChild(modal);
  box.__nav=function(path){
    navPath=path;
    const content=box.querySelector('#moveFolderContent');
    content.innerHTML=renderFolderList(path?decodeURIComponent(path):'');
    bindFolderButtons();
  };
  function bindFolderButtons(){
    box.querySelectorAll('[data-move-folder]').forEach(btn=>{
      btn.onclick=async()=>{
        const folder=decodeURIComponent(btn.getAttribute('data-move-folder'));
        document.body.removeChild(modal);
        await moveFileToFolder(f.id,folder);
      };
    });
    box.querySelectorAll('[data-nav-folder]').forEach(btn=>{
      btn.onclick=()=>{
        const folder=decodeURIComponent(btn.getAttribute('data-nav-folder'));
        navPath=folder;
        const content=box.querySelector('#moveFolderContent');
        content.innerHTML=renderFolderList(folder);
        bindFolderButtons();
      };
    });
  }
  bindFolderButtons();
  box.querySelector('#moveToNewFolder').onclick=async()=>{
    const newFolder=box.querySelector('#newFolderInput').value.trim();
    if(!newFolder){toast('请输入文件夹路径');return}
    document.body.removeChild(modal);
    await moveFileToFolder(f.id,newFolder);
  };
  box.querySelector('#moveCancel').onclick=()=>{document.body.removeChild(modal)};
}

async function smartSyncOnOpen(localFile){
  const config=getSyncConfig();
  if(!config.enabled||!localFile.id)return;
  if(localFile.isNewFile)return;
  try{
    const cloudResult=await findFileInCloudById(localFile.id);
    if(!cloudResult.networkOk||!cloudResult.file)return;
    const cloudVer=parseInt(cloudResult.file.版本号||'0');
    const localVer=localFile.version||0;
    if(cloudVer<=localVer)return;
    if(!hasLocalEdits(localFile.name)){
      const content=cloudResult.file.内容||'';
      const cloudFileName=cloudResult.file.文件名||localFile.name;
      const idx=getFileIndex();
      const entry=idx.find(x=>x.id===localFile.id);
      const needRename=entry?syncLocalFileName(entry,cloudFileName):false;
      if(entry){
        const cloudFolder=cloudResult.file.文件夹路径||'';
        if(cloudFolder!==undefined&&(entry.folder||'')!==cloudFolder){
          entry.folder=cloudFolder;
        }
      }
      if(needRename)setFileIndex(idx);
      saveFileData(currentFileName,content);
      setFileVersion(currentFileName,cloudVer);
      setLastSyncVersion(currentFileName,cloudVer);
      clearNewFileFlag(localFile.id);
      currentFileContent=content;
      notifyParent('fileContentUpdated',{name:currentFileName,content});
      renderFileList();
      toast('已自动同步云端更新 v'+cloudVer);
    }else{
      toast('云端有更新(v'+cloudVer+')，本地有未同步编辑，请手动同步');
    }
  }catch(e){}
}

async function refreshCloudList(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return}
  const btn=document.getElementById('refreshCloudBtn');
  btn.disabled=true;btn.textContent='刷新中...';
  try{
    const cloudResult=await callCloudAPI('读取全部');
    cloudFileCache.clear();
    if(cloudResult.status==='success'&&cloudResult.数据){
      for(const cf of cloudResult.数据){
        if(cf.ID&&cf.ID.trim()!==''){
          cloudFileCache.set(cf.ID,{文件名:cf.文件名||'',版本号:cf.版本号||'0',文件夹路径:cf.文件夹路径||''});
        }
      }
      const idx=getFileIndex();
      let changed=false;
      const cloudIds=new Set(cloudFileCache.keys());
      const notInCloud=[];
      for(const f of idx){
        if(f.isNewFile)continue;
        if(!cloudIds.has(f.id)){
          notInCloud.push(f.name);
        }
      }
      if(notInCloud.length>0){
        toast('以下本地文件在云端未找到(可能已被云端删除)：'+notInCloud.join('、'));
      }
      for(const f of idx){
        if(f.isNewFile)continue;
        const cloud=cloudFileCache.get(f.id);
        if(cloud&&cloud.文件名&&cloud.文件名!==f.name){
          syncLocalFileName(f,cloud.文件名);
          changed=true;
        }
        if(cloud&&cloud.文件夹路径!==undefined&&(f.folder||'')!==cloud.文件夹路径){
          f.folder=cloud.文件夹路径;
          changed=true;
        }
      }
      if(changed)setFileIndex(idx);
    }else if(cloudResult.status==='success'&&!cloudResult.数据){
      cloudFileCache.clear();
    }else if(cloudResult.isNetworkError){
      toast('网络异常，云端刷新失败');
    }else if(cloudResult.status!=='success'){
      toast('云端刷新失败：'+(cloudResult.tongzhi||cloudResult.message||'未知错误'));
    }
  }catch(e){
    toast('云端刷新异常：'+e.message);
  }finally{
    btn.disabled=false;btn.textContent='刷新云端';
    renderFileList();
    if(cloudFileCache.size>0)toast('云端列表已刷新，共'+cloudFileCache.size+'个文件');
  }
}

async function renameCurrentFile(){
  if(!currentFileName){toast('当前没有打开的文件');return}
  const oldName=currentFileName;
  let newName=document.getElementById('fileNameInput').value.trim();
  if(!newName){toast('请输入新文件名');return}
  if(!newName.endsWith('.txt'))newName+='.txt';
  if(newName===oldName){toast('文件名未变化');return}
  const meta=getFileMeta(oldName);
  const config=getSyncConfig();
  if(config.enabled){
    updateSyncButton('🔄');
    const cloudResult=await findFileInCloudById(meta.id);
    if(!cloudResult.networkOk){
      toast('网络异常，无法确认云端状态，重命名中止');
      updateSyncButton('☁️');
      return;
    }
    if(cloudResult.file&&cloudResult.file._行号){
      const netTime=await getNetworkTime();
      const result=await callCloudAPI('批量写入',{
        行号:cloudResult.file._行号,
        数据:{ID:meta.id,文件名:newName,文件夹路径:meta.folder||'',最后上传发起时间:formatBeijingTime(netTime)}
      });
      if(result.status!=='success'){
        if(result.isNetworkError){
          toast('网络异常，云端重命名失败，重命名中止');
        }else{
          toast('云端重命名失败：'+(result.tongzhi||result.message||'业务错误'));
        }
        updateSyncButton('☁️');
        return;
      }
      setLastSyncTime(Date.now());
    }
  }
  const fd=loadFileData(oldName);
  if(fd){
    localStorage.removeItem('mindmap_file_id_'+meta.id);
    localStorage.setItem('mindmap_file_id_'+meta.id,JSON.stringify({data:fd.data,view:fd.view||{zoom:1,panX:0,panY:0}}));
    const idx=getFileIndex();
    const f=idx.find(x=>x.id===meta.id);
    if(f){f.name=newName}
    setFileIndex(idx);
  }
  currentFileName=newName;
  updateSyncButton('☁️');
  notifyParent('fileRenamed',{oldName,newName});
  renderFileList();
  toast('已重命名为：'+newName);
}

async function copyCurrentFile(){
  if(!currentFileName){toast('请先选择一个文件');return}
  const fd=loadFileData(currentFileName);
  if(!fd){toast('文件不存在');return}
  const baseName=currentFileName.replace('.txt','');
  const idx=getFileIndex();
  let copyName=baseName+'_副本.txt';
  let n=1;
  while(idx.find(f=>f.name===copyName)){copyName=baseName+'_副本'+(++n)+'.txt'}
  const content=fd.data||'';
  const copyId=genFileId();
  saveFileData(copyName,content);
  const idx2=getFileIndex();
  const f=idx2.find(x=>x.name===copyName);
  if(f){
    const oldId=f.id;
    if(oldId&&oldId!==copyId){
      const raw=localStorage.getItem('mindmap_file_id_'+oldId);
      if(raw){localStorage.setItem('mindmap_file_id_'+copyId,raw);localStorage.removeItem('mindmap_file_id_'+oldId)}
    }
    f.id=copyId;f.version=1;f.lastSyncVersion=0;f.isNewFile=true;setFileIndex(idx2);
  }
  const config=getSyncConfig();
  if(config.enabled){
    const netTime=await getNetworkTime();
    const newRow=await findFirstEmptyRow();
    const result=await callCloudAPI('批量写入',{
      行号:newRow,
      数据:{ID:copyId,文件名:copyName,内容:content,版本号:'1',文件夹路径:getFileMeta(copyName).folder||'',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
    });
    if(result.status==='success'){
      setLastSyncVersion(copyName,1);
      clearNewFileFlag(copyId);
      setLastSyncTime(Date.now());
      toast('已复制并上传：'+copyName);
    }else{
      toast('已复制本地，云端上传失败：'+(result.tongzhi||result.message||''));
    }
  }else{
    toast('已复制：'+copyName);
  }
  renderFileList();
}

function handleFileImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(ev){
    const content=ev.target.result;
    const fileName=file.name;
    const idx=getFileIndex();
    const existing=idx.find(x=>x.name===fileName);
    if(existing){
      const choice=await showImportChoice(fileName);
      if(choice==='update'){
        existing.version=(existing.version||0)+10;
        existing.lastSyncVersion=existing.lastSyncVersion||0;
        if(!existing.id){existing.id=genFileId()}
        setFileIndex(idx);
        saveFileData(fileName,content);
        currentFileName=fileName;
        currentFileContent=content;
        notifyParent('openFile',{name:fileName,content,id:existing.id});
        await uploadCurrentFile();
        toast('已更新：'+fileName+' v'+existing.version+'（可撤销）');
      }else if(choice==='newfile'){
        const baseName=fileName.replace('.txt','');
        let newName=baseName+'_导入.txt';
        let n=1;
        while(idx.find(x=>x.name===newName)){newName=baseName+'_导入'+(++n)+'.txt'}
        const newId=genFileId();
        saveFileData(newName,content);
        const idx2=getFileIndex();
        const f=idx2.find(x=>x.name===newName);
        if(f){
          const oldId=f.id;
          if(oldId&&oldId!==newId){const raw=localStorage.getItem('mindmap_file_id_'+oldId);if(raw){localStorage.setItem('mindmap_file_id_'+newId,raw);localStorage.removeItem('mindmap_file_id_'+oldId)}}
          f.id=newId;f.version=1;f.lastSyncVersion=0;f.isNewFile=true;setFileIndex(idx2);
        }
        currentFileName=newName;
        currentFileContent=content;
        notifyParent('openFile',{name:newName,content,id:newId});
        await uploadCurrentFile();
        toast('已新建：'+newName);
      }
    }else{
      const newId=genFileId();
      saveFileData(fileName,content);
      const idx2=getFileIndex();
      const f=idx2.find(x=>x.name===fileName);
      if(f){
        const oldId=f.id;
        if(oldId&&oldId!==newId){const raw=localStorage.getItem('mindmap_file_id_'+oldId);if(raw){localStorage.setItem('mindmap_file_id_'+newId,raw);localStorage.removeItem('mindmap_file_id_'+oldId)}}
        f.id=newId;f.version=1;f.lastSyncVersion=0;f.isNewFile=true;setFileIndex(idx2);
      }
      currentFileName=fileName;
      currentFileContent=content;
      notifyParent('openFile',{name:fileName,content,id:newId});
      await uploadCurrentFile();
      toast('已导入：'+fileName);
    }
  };
  reader.readAsText(file,'utf-8');
  e.target.value='';
}

function startAutoSync(){
  stopAutoSync();
  const config=getSyncConfig();
  if(!config.enabled)return;
  autoSyncCheckTimer=setInterval(()=>{
    checkAutoSyncTriggers();
  },5000);
}

function stopAutoSync(){
  if(autoSyncCheckTimer){clearInterval(autoSyncCheckTimer);autoSyncCheckTimer=null}
  if(autoSyncTimer){clearTimeout(autoSyncTimer);autoSyncTimer=null}
}

function checkAutoSyncTriggers(){
  const config=getSyncConfig();
  if(!config.enabled||!currentFileName)return;
  if(syncMutex)return;
  const now=Date.now();
  const deltaIntervalMs=(config.syncDeltaInterval||5)*1000;
  if(now-lastDeltaSyncTime<deltaIntervalMs)return;
  const meta=getFileMeta(currentFileName);
  if(!meta.isNewFile&&hasLocalEdits(currentFileName)){
    const diff=(meta.version||0)-(meta.lastSyncVersion||0);
    if(diff>=(config.syncThreshold||10)){
      lastDeltaSyncTime=now;
      autoSyncCurrentFile('差值触发(v+'+diff+')');
      return;
    }
  }
  const lastAny=getLastSyncTime();
  const checkIntervalMs=(config.cloudCheckInterval||5)*60*1000;
  if(lastAny>0&&now-lastAny>=checkIntervalMs){
    lastDeltaSyncTime=now;
    autoSyncCurrentFile('定时触发');
    return;
  }
}

async function autoSyncCurrentFile(reason){
  if(syncMutex||!currentFileName)return;
  const config=getSyncConfig();
  if(!config.enabled)return;
  syncCurrentFileFromLocal();
  if(!currentFileContent&&currentFileName){
    const fd=loadFileData(currentFileName);
    if(fd&&fd.data)currentFileContent=fd.data;
  }
  await enqueueSync(async()=>{
    try{
      const dlResult=await downloadCurrentFile();
      if(dlResult.status==='conflict'){
        toast('自动同步('+reason+')：版本冲突，请手动处理');
        return;
      }
      if(dlResult.status==='error'){
        toast('自动同步('+reason+')：下载失败，跳过上传');
        return;
      }
      await uploadCurrentFile();
      setLastSyncTime(Date.now());
    }catch(e){}
  },'自动同步');
}

function triggerOpenFileSync(fileName){
  const config=getSyncConfig();

  const meta=getFileMeta(fileName);
  if(meta.isNewFile)return;
  const cloud=cloudFileCache.get(meta.id);
  if(!cloud)return;
  const cloudVer=parseInt(cloud.版本号||'0');

  if(localVer>=cloudVer&&!hasLocalEdits(fileName))return;

  },1000);

async function syncCurrentFile(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return}
  if(!currentFileName){toast('请先打开文件');return}
  if(syncMutex){toast('同步排队中，请稍候');return}
  await enqueueSync(async()=>{
    updateSyncButton('🔄');
    try{
      const dlResult=await downloadCurrentFile();
      if(dlResult.status==='conflict'){
        toast('下载阶段发现冲突，请处理后继续上传');
        await new Promise(resolve=>{conflictResolver=resolve});
      }
      if(dlResult.status==='success'){
        toast('下载完成，即将上传...');
      }
      await uploadCurrentFile();
    }catch(e){
      toast('同步异常：'+e.message);
    }finally{
      conflictResolver=null;
    }
  },'单文件同步');
}

async function uploadCurrentFile(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return{status:'error',message:'未启用',isNetworkError:false}}
  if(!currentFileName){toast('请先打开文件');return{status:'error',message:'无文件',isNetworkError:false}}
  const fileName=currentFileName;
  const meta=getFileMeta(fileName);
  if(!currentFileContent){
    const fd=loadFileDataById(meta.id)||loadFileData(fileName);
    if(fd&&fd.data)currentFileContent=fd.data;
  }
  const snapshotContent=currentFileContent;
  const snapshotVersion=getFileVersion(fileName);
  const snapshotFileName=fileName;
  const snapshotId=meta.id;
  const snapshotFolder=meta.folder||'';
  updateSyncButton('🔄');
  const netTime=await getNetworkTime();
  const uploadContent=snapshotContent;
  const uploadVersion=snapshotVersion;
  const uploadFileName=snapshotFileName;
  const uploadId=snapshotId;
  const uploadFolder=snapshotFolder;
  const cloudResult=await findFileInCloudById(uploadId);
  if(!cloudResult.networkOk){
    updateSyncButton('❌');
    setTimeout(()=>updateSyncButton('☁️'),2000);
    toast('网络异常，无法确认云端状态');
    return{status:'error',message:'网络异常',isNetworkError:true};
  }
  if(!cloudResult.file){
    const newRow=await findFirstEmptyRow();
    const writeResult=await callCloudAPI('批量写入',{
      行号:newRow,
      数据:{ID:uploadId,文件名:uploadFileName,内容:uploadContent,版本号:uploadVersion.toString(),文件夹路径:uploadFolder,最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
    });
    if(writeResult.status!=='success'){
      toast('云端新建失败：'+(writeResult.tongzhi||writeResult.message||'未知错误'));
      updateSyncButton('❌');
      setTimeout(()=>updateSyncButton('☁️'),2000);
      return{status:'error',message:'云端新建失败',isNetworkError:!!writeResult.isNetworkError};
    }
    setLastSyncTime(Date.now());
    setLastSyncVersion(uploadFileName,uploadVersion);
    clearNewFileFlag(uploadId);
    updateSyncButton('✅');
    setTimeout(()=>updateSyncButton('☁️'),2000);
    toast('已新建云端文件，版本: '+uploadVersion);
    return{status:'success',version:uploadVersion};
  }
  const existingFile=cloudResult.file;
  const cloudVer=parseInt(existingFile.版本号||'0');
  if(cloudVer===uploadVersion){
    setLastSyncTime(Date.now());
    clearNewFileFlag(uploadId);
    updateSyncButton('☁️');
    toast('云端已是最新');
    return{status:'no_update',version:uploadVersion};
  }
  if(cloudVer>uploadVersion){
    pendingCloudVersion=cloudVer;
    showSyncConflict(cloudVer,'upload');
    updateSyncButton('☁️');
    return{status:'conflict',message:'云端版本更高'};
  }
  const writeResult=await callCloudAPI('批量写入',{
    行号:existingFile._行号,
    数据:{ID:uploadId,文件名:uploadFileName,内容:uploadContent,版本号:uploadVersion.toString(),文件夹路径:uploadFolder,最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
  });
  if(writeResult.status!=='success'){
    toast('上传失败：'+(writeResult.tongzhi||writeResult.message||'未知错误'));
    updateSyncButton('❌');
    setTimeout(()=>updateSyncButton('☁️'),2000);
    return{status:'error',message:'上传失败',isNetworkError:!!writeResult.isNetworkError};
  }
  setLastSyncTime(Date.now());
  setLastSyncVersion(uploadFileName,uploadVersion);
  clearNewFileFlag(uploadId);
  updateSyncButton('✅');
  setTimeout(()=>updateSyncButton('☁️'),2000);
  toast('已上传覆盖云端，版本: '+uploadVersion);
  return{status:'success',version:uploadVersion};
}

async function downloadCurrentFile(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return{status:'error',message:'未启用',isNetworkError:false}}
  if(!currentFileName){toast('请先打开文件');return{status:'error',message:'无文件',isNetworkError:false}}
  const fileName=currentFileName;
  const localVer=getFileVersion(fileName);
  const meta=getFileMeta(fileName);
  updateSyncButton('🔄');
  const cloudResult=await findFileInCloudById(meta.id);
  if(!cloudResult.networkOk){
    updateSyncButton('❌');
    setTimeout(()=>updateSyncButton('☁️'),2000);
    toast('网络异常，无法确认云端状态');
    return{status:'error',message:'网络异常',isNetworkError:true};
  }
  if(!cloudResult.file){
    updateSyncButton('☁️');
    toast('云端无此文件');
    return{status:'no_file',message:'云端无此文件'};
  }
  const existingFile=cloudResult.file;
  const cloudVer=parseInt(existingFile.版本号||'0');
  if(cloudVer<=localVer){
    updateSyncButton('☁️');
    toast('本地版本更高或相同，无需下载');
    return{status:'no_update',version:localVer};
  }
  if(hasLocalEdits(fileName)){
    pendingCloudVersion=cloudVer;
    showSyncConflict(cloudVer,'download_has_edits');
    updateSyncButton('☁️');
    return{status:'conflict',message:'本地有未同步编辑，云端版本更高'};
  }
  const content=existingFile.内容||'';
  const cloudFileName=existingFile.文件名||fileName;
  const idx=getFileIndex();
  const localEntry=idx.find(x=>x.id===meta.id);
  const needRename=localEntry?syncLocalFileName(localEntry,cloudFileName):false;
  if(needRename)setFileIndex(idx);
  setFileVersion(currentFileName,cloudVer);
  setLastSyncVersion(currentFileName,cloudVer);
  clearNewFileFlag(meta.id);
  saveFileData(currentFileName,content);
  setLastSyncTime(Date.now());
  currentFileContent=content;
  notifyParent('fileContentUpdated',{name:currentFileName,content});
  renderFileList();
  updateSyncButton('✅');
  setTimeout(()=>updateSyncButton('☁️'),2000);
  toast('已下载，版本: '+cloudVer+(needRename?' → '+cloudFileName:''));
  return{status:'success',version:cloudVer};
}

async function syncAllFiles(){
  const config=getSyncConfig();
  if(!config.enabled){toast('云同步未启用');return}
  if(syncMutex){toast('同步排队中，请稍候')}
  await enqueueSync(async()=>{
    const btn=document.getElementById('syncAllBtn');
    const status=document.getElementById('fileSyncStatus');
    btn.disabled=true;btn.textContent='同步中...';
    status.style.display='block';status.style.color='#666';
    status.textContent='🔄 正在同步全部文件...';
    let uploaded=0,downloaded=0,deleted=0,skipped=0,errors=0;
    try{
      const cloudResult=await callCloudAPI('读取全部');
      if(cloudResult.status!=='success'||!cloudResult.数据){
        status.style.color='#e74c3c';
        status.textContent='❌ 获取云端数据失败：'+(cloudResult.tongzhi||cloudResult.message||'未知错误');
        btn.disabled=false;btn.textContent='全部同步';
        return;
      }
      const cloudFiles=cloudResult.数据;
      const cloudIds=new Set();
      const cloudById=new Map();
      for(const cf of cloudFiles){
        if(cf.ID&&cf.ID.trim()!==''){
          cloudIds.add(cf.ID);
          cloudById.set(cf.ID,cf);
        }
      }
      const idx=getFileIndex();
      for(const f of idx){
        if(!f.id||f.id.trim()===''){f.id=genFileId();f.isNewFile=true}
        if(f.version===undefined)f.version=0;
        if(f.lastSyncVersion===undefined)f.lastSyncVersion=0;
      }
      setFileIndex(idx);
      for(const cf of cloudFiles){
        if(!cf.ID||cf.ID.trim()==='')continue;
        if(!cf.文件名||cf.文件名.trim()==='')continue;
        const localFile=idx.find(f=>f.id===cf.ID);
        if(!localFile){
          idx.push({name:cf.文件名,time:Date.now(),id:cf.ID,version:parseInt(cf.版本号||'0'),lastSyncVersion:parseInt(cf.版本号||'0'),folder:cf.文件夹路径||''});
          setFileIndex(idx);
          if(cf.内容){
            saveFileData(cf.文件名,cf.内容);
            if(cf.文件名===currentFileName){
              currentFileContent=cf.内容;
              notifyParent('fileContentUpdated',{name:currentFileName,content:cf.内容});
            }
          }
          downloaded++;
        }else{
          const localVer=localFile.version||0;
          const cloudVer=parseInt(cf.版本号||'0');
          if(cloudVer>localVer){
            if(!hasLocalEdits(localFile.name)){
              if(cf.内容){
                syncLocalFileName(localFile,cf.文件名);
                setFileIndex(idx);
                saveFileData(localFile.name,cf.内容);
                localFile.version=cloudVer;
                localFile.lastSyncVersion=cloudVer;
                if(localFile.name===currentFileName){
                  currentFileContent=cf.内容;
                  notifyParent('fileContentUpdated',{name:currentFileName,content:cf.内容});
                }
              }
              downloaded++;
            }else{
              const choice=await showAllSyncConflict(localFile.name,localVer,cloudVer);
              if(choice==='overwrite'&&cf.内容){
                syncLocalFileName(localFile,cf.文件名);
                setFileIndex(idx);
                saveFileData(localFile.name,cf.内容);
                localFile.version=cloudVer;
                localFile.lastSyncVersion=cloudVer;
                if(localFile.name===currentFileName){
                  currentFileContent=cf.内容;
                  notifyParent('fileContentUpdated',{name:currentFileName,content:cf.内容});
                }
                downloaded++;
              }else if(choice==='conflict'){
                const netTime=await getNetworkTime();
                const ts=formatBeijingTime(netTime).replace(/[-: ]/g,'').substring(0,14);
                const conflictName=localFile.name.replace('.txt','')+'冲突版本'+ts+'.txt';
                const newId=genFileId();
                const fd=loadFileData(localFile.name);
                if(fd&&fd.data){
                  const oldId=localFile.id;
                  localStorage.removeItem('mindmap_file_id_'+oldId);
                  localStorage.setItem('mindmap_file_id_'+newId,JSON.stringify({data:fd.data,view:fd.view||{zoom:1,panX:0,panY:0}}));
                  localFile.name=conflictName;
                  localFile.id=newId;
                  localFile.version=1;
                  localFile.lastSyncVersion=0;
                  localFile.isNewFile=true;
                  setFileIndex(idx);
                  const newRow=await findFirstEmptyRow();
                  const wr=await callCloudAPI('批量写入',{
                    行号:newRow,
                    数据:{ID:newId,文件名:conflictName,内容:fd.data,版本号:'1',文件夹路径:localFile.folder||'',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
                  });
                  if(wr.status==='success'){
                    setLastSyncVersion(conflictName,1);
                    clearNewFileFlag(newId);
                  }
                }
                if(cf.内容){
                  const newLocalEntry={name:cf.文件名,time:Date.now(),id:cf.ID,version:cloudVer,lastSyncVersion:cloudVer,folder:cf.文件夹路径||''};
                  idx.push(newLocalEntry);
                  setFileIndex(idx);
                  saveFileData(cf.文件名,cf.内容);
                  if(cf.文件名===currentFileName){
                    currentFileContent=cf.内容;
                    notifyParent('fileContentUpdated',{name:currentFileName,content:cf.内容});
                  }
                }
                downloaded++;
              }else if(choice==='reverse'){
                const netTime=await getNetworkTime();
                const fd=loadFileData(localFile.name);
                const newVer=cloudVer+10;
                if(fd&&fd.data){
                  const cloudLookup=await findFileInCloudById(localFile.id);
                  if(cloudLookup.networkOk&&cloudLookup.file&&cloudLookup.file._行号){
                    const wr=await callCloudAPI('批量写入',{
                      行号:cloudLookup.file._行号,
                      数据:{ID:localFile.id,文件名:localFile.name,内容:fd.data,版本号:newVer.toString(),文件夹路径:localFile.folder||'',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
                    });
                    if(wr.status==='success'){
                      localFile.version=newVer;
                      localFile.lastSyncVersion=newVer;
                      setFileIndex(idx);
                      setLastSyncVersion(localFile.name,newVer);
                      uploaded++;
                    }else{errors++}
                  }else{errors++}
                }
              }else{skipped++}
            }
          }
        }
      }
      const localNotInCloud=[];
      for(let i=idx.length-1;i>=0;i--){
        const f=idx[i];
        if(cloudIds.has(f.id))continue;
        if(f.isNewFile)continue;
        localNotInCloud.push(f.name);
      }
      if(localNotInCloud.length>0&&!confirm('以下本地文件在云端未找到，是否删除本地副本？\n'+localNotInCloud.join('、'))){
        localNotInCloud.length=0;
      }
      for(let i=idx.length-1;i>=0;i--){
        const f=idx[i];
        if(cloudIds.has(f.id))continue;
        if(f.isNewFile)continue;
        if(!localNotInCloud.includes(f.name))continue;
        deleteFileData(f.name);
        idx.splice(i,1);
        deleted++;
      }
      setFileIndex(idx);
      for(const f of idx){
        try{
          const fd=loadFileData(f.name);
          if(!fd||!fd.data)continue;
          const cloudLookup=await findFileInCloudById(f.id);
          if(!cloudLookup.networkOk){errors++;continue}
          if(!cloudLookup.file){
            const netTime=await getNetworkTime();
            const newRow=await findFirstEmptyRow();
            const wr=await callCloudAPI('批量写入',{
              行号:newRow,
              数据:{ID:f.id,文件名:f.name,内容:fd.data,版本号:(f.version||0).toString(),文件夹路径:f.folder||'',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
            });
            if(wr.status==='success'){
              setLastSyncVersion(f.name,f.version||0);
              clearNewFileFlag(f.id);
              uploaded++;
            }else{errors++}
          }else{
            const cloudFile=cloudLookup.file;
            const cloudVer=parseInt(cloudFile.版本号||'0');
            if((f.version||0)>cloudVer){
              const netTime=await getNetworkTime();
              const wr=await callCloudAPI('批量写入',{
                行号:cloudFile._行号,
                数据:{ID:f.id,文件名:f.name,内容:fd.data,版本号:(f.version||0).toString(),文件夹路径:f.folder||'',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
              });
              if(wr.status==='success'){
                setLastSyncVersion(f.name,f.version||0);
                clearNewFileFlag(f.id);
                uploaded++;
              }else{errors++}
            }
          }
        }catch(e){errors++}
      }
      for(const cf of cloudFiles){
        if(cf.ID&&cf.ID.trim()!=='')continue;
        if(!cf.文件名||cf.文件名.trim()==='')continue;
        const localByName=idx.find(f=>f.name===cf.文件名);
        if(!localByName){
          try{
            const lookup=await callCloudAPI('查找',{列名:'文件名',关键字:cf.文件名});
            if(lookup.status==='success'&&lookup.匹配数>0&&lookup.数据[0]._行号){
              callCloudAPI('批量写入',{
                行号:lookup.数据[0]._行号,
                数据:{ID:'',文件名:'',内容:'',版本号:'',文件夹路径:'',同步时间:'',最后上传发起时间:'',最后编辑时间:''}
              }).catch(()=>{});
            }
          }catch(e){}
        }
      }
    }catch(e){errors++}
    renderFileList();
    document.getElementById('mainUI').style.display='';
    status.style.color=errors?'#e67e22':'#27ae60';
    let msg='✅ 同步完成 | 上传: '+uploaded+' | 下载: '+downloaded+' | 远程删除: '+deleted;
    if(skipped)msg+=' | 有编辑跳过: '+skipped;
    if(errors)msg+=' | 错误: '+errors;
    status.textContent=msg;
    toast(msg);
    btn.disabled=false;btn.textContent='全部同步';
    setLastSyncTime(Date.now());
    refreshCloudList();
  },'全部同步');
}

async function initSyncSheet(){
  const config=getSyncConfig();
  if(!config.enabled)return;
  try{
    const headersResult=await callCloudAPI('获取表头');
    if(headersResult.status==='success'){
      const existingHeaders=headersResult.表头||[];
      const requiredHeaders=['ID','文件名','内容','版本号','同步时间','最后上传发起时间','最后编辑时间','文件夹路径'];
      const hasAllHeaders=requiredHeaders.every(h=>existingHeaders.includes(h));
      if(hasAllHeaders)return;
    }
    const requiredHeaders=['ID','文件名','内容','版本号','同步时间','最后上传发起时间','最后编辑时间','文件夹路径'];
    const result=await callCloudAPI('初始化表头',{表头:requiredHeaders});
    if(result.status==='success'){
      console.log('已初始化云端表头');
    }else{
      console.log('初始化表头失败:',result.tongzhi||result.message);
    }
  }catch(error){
    console.log('初始化表头失败:',error);
  }
}

window.addEventListener('message',function(e){
  const data=e.data;
  if(!data||!data.type)return;
  if(!data.target||data.target!=='fileManager')return;
  switch(data.type){
    case 'open':
    case 'init':
    case 'setCurrentFile':
      currentFileName=data.currentFileName||data.name||'';
      currentFileContent=data.currentContent||data.content||'';
      document.getElementById('fileNameInput').value=currentFileName.replace('.txt','');
      renderFileList();
      break;
    case 'fileDeleted':
      if(currentFileName===data.name){
        currentFileName='';
        currentFileContent='';
      }
      renderFileList();
      break;
    case 'fileRenamed':
      if(currentFileName===data.oldName){
        currentFileName=data.newName;
        document.getElementById('fileNameInput').value=currentFileName.replace('.txt','');
      }
      renderFileList();
      break;
    case 'openFile':
      if(data.id){openFileById(data.id)}
      else if(data.name){
        const idx=getFileIndex();
        const f=idx.find(x=>x.name===data.name);
        if(f&&f.id)openFileById(f.id);
      }
      break;
    case 'refreshFileList':
      renderFileList();
      break;
    case 'syncComplete':
      toast('同步完成 | 拉取:'+(data.pulled||0)+' 上传:'+(data.uploaded||0));
      break;
    case 'syncCurrentFromMain':
      (async function(){
        try{
          syncCurrentFileFromLocal();
          await syncCurrentFile();
        }catch(err){}
      })();
      break;
    case 'fileContentChanged':
      break;
    case 'mainReady':
      startAutoSync();
      break;
    case 'mainActivated':
      startAutoSync();
      break;
    case 'refreshCloud':
      refreshCloudList().catch(()=>{});
      break;
    case 'smartSyncOnOpen':
      (async function(){
        try{
          const idx=getFileIndex();
          const f=idx.find(x=>x.id===data.fileId);
          if(f&&!f.isNewFile){
            const cloudResult=await findFileInCloudById(data.fileId);
            if(cloudResult.networkOk&&cloudResult.file){
              const cloudVer=parseInt(cloudResult.file.版本号||'0');
              const localVer=f.version||0;
              if(cloudVer>localVer){
                if(!hasLocalEdits(f.name)){
                  const content=cloudResult.file.内容||'';
                  notifyParent('fileContentUpdated',{name:f.name,content:content});
                  setFileVersion(f.name,cloudVer);
                  setLastSyncVersion(f.name,cloudVer);
                  clearNewFileFlag(f.id);
                  setLastSyncTime(Date.now());
                  notifyParent('syncToast',{message:'已自动同步云端更新 v'+cloudVer});
                  notifyParent('versionUpdated',{fileName:f.name,version:cloudVer,lastSyncVersion:cloudVer});
                }else{
                  notifyParent('syncToast',{message:'云端有更新(v'+cloudVer+')，本地有未同步编辑，请手动同步'});
                }
              }
            }
          }
        }catch(err){}
      })();
      break;
    case 'uploadCurrent':
      (async function(){
        try{
          syncCurrentFileFromLocal();
          await uploadCurrentFile();
        }catch(err){}
      })();
      break;
    case 'syncAllFiles':
      syncAllFiles();
      break;
    case 'downloadCloudFile':
      (async function(){
        try{
          await downloadCloudFileById(data.fileId,data.fileName);
        }catch(err){}
      })();
      break;
    case 'fileRenamed_local':
      (async function(){
        try{
          const idx=getFileIndex();
          const f=idx.find(x=>x.id===data.fileId);
          if(!f)return;
          const cloudResult=await findFileInCloudById(data.fileId);
          if(cloudResult.networkOk&&cloudResult.file&&cloudResult.file._行号){
            const netTime=await getNetworkTime();
            await callCloudAPI('批量写入',{
              行号:cloudResult.file._行号,
              数据:{ID:data.fileId,文件名:f.name,最后上传发起时间:formatBeijingTime(netTime)}
            });
            setLastSyncTime(Date.now());
          }
        }catch(err){}
      })();
      break;
    case 'fileDeleted_local':
      (async function(){
        try{
          const cloudResult=await findFileInCloudById(data.fileId);
          if(cloudResult.networkOk&&cloudResult.file&&cloudResult.file._行号){
            const netTime=await getNetworkTime();
            await callCloudAPI('批量写入',{
              行号:cloudResult.file._行号,
              数据:{ID:'删除FYHFOX'+data.fileId,文件名:'',内容:'',版本号:'0',最后上传发起时间:formatBeijingTime(netTime)}
            });
            setLastSyncTime(Date.now());
          }
        }catch(err){}
      })();
      break;
    case 'fileCopied':
      (async function(){
        try{
          const idx=getFileIndex();
          const f=idx.find(x=>x.id===data.fileId);
          if(!f)return;
          const fd=loadFileDataById(data.fileId);
          const content=fd?fd.data:'';
          const netTime=await getNetworkTime();
          const newRow=await findFirstEmptyRow();
          const result=await callCloudAPI('批量写入',{
            行号:newRow,
            数据:{ID:data.fileId,文件名:f.name,内容:content,版本号:'1',最后上传发起时间:formatBeijingTime(netTime),最后编辑时间:getLastEditTime()}
          });
          if(result.status==='success'){
            setLastSyncVersion(f.name,1);
            clearNewFileFlag(data.fileId);
            setLastSyncTime(Date.now());
          }
        }catch(err){}
      })();
      break;
    case 'contentChanged':
      syncCurrentFileFromLocal();
      break;
    case 'currentContentResponse':
      break;
  }
});

(function init(){
  const savedCurrent=localStorage.getItem('mindmap_current_file');
  if(savedCurrent){
    currentFileName=savedCurrent;
    const fd=loadFileData(savedCurrent);
    if(fd)currentFileContent=fd.data||'';
    document.getElementById('fileNameInput').value=currentFileName.replace('.txt','');
  }
  renderFileList();
  updateFolderPath();
  const config=getSyncConfig();
  if(config.enabled){
    initSyncSheet().catch(()=>{});
    refreshCloudList().catch(()=>{});
    startAutoSync();
    triggerLoginSync();
  }
})();
